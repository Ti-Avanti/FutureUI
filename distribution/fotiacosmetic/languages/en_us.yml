# 所有菜单文本支持 MiniMessage 和旧颜色码；请保留占位符。
prefix: '<gray>[<gold>FotiaCosmetic</gold>]</gray> '
general:
  not-ready: <red>The cosmetic system is still initializing. Try again shortly.
  no-permission: <red>You do not have permission to do that.
  player-only: <red>This command can only be used by a player.
  player-not-found: <red>Player <white>{player}</white> was not found.
  cosmetic-not-found: <red>Cosmetic <white>{cosmetic}</white> was not found.
  invalid-target: '<red>Invalid slot or weapon type: <white>{target}</white>.'
  cosmetic-target-mismatch: <red><white>{cosmetic}</white> belongs to <white>{actual}</white>, not <white>{expected}</white>.
  invalid-duration: <red>Invalid duration <white>{duration}</white>. Use permanent, 1h, 1d12h, 7d, or an ISO-8601
    instant.
  operation-failed: '<red>Operation failed: <white>{reason}</white>.'
  reload-success: <green>Configuration, languages, catalog, and menu reloaded.
  reload-failed: <red>Reload failed. Check the console for the exact configuration path.
command:
  management-help: <yellow>/fc</yellow> opens the menu; grant with <yellow>/fc grant [player|*] [slot|weapon] [slot|weapon-type]
    [ID] [permanent|1h|1d]</yellow>; revoke/equip use the same target fields, and unequip omits the ID.
  grant-success: <green>Granted <white>{cosmetic}</white> to <white>{player}</white>.
  grant-limited-success: <green>Granted <white>{cosmetic}</white> to <white>{player}</white> for <white>{duration}</white>.
  grant-all-success: '<green>Granted <white>{cosmetic}</white> to all known players: {total} total, {updated} updated,
    {unchanged} unchanged, {failed} failed.'
  grant-all-limited-success: '<green>Granted <white>{cosmetic}</white> to all known players for {duration}: {total}
    total, {updated} updated, {unchanged} unchanged, {failed} failed.'
  revoke-success: <green>Revoked <white>{cosmetic}</white> from <white>{player}</white>.
  equip-success: <green>Selected <white>{cosmetic}</white> for <white>{player}</white>.
  unequip-success: <green>Cleared <white>{player}</white>'s <white>{target}</white> cosmetic.
  already-owned: <yellow>The player already owns that cosmetic.
  not-owned: <red>The player does not own that cosmetic.
  not-selected: <yellow>No cosmetic is selected for that target.
  cancelled: <yellow>Another plugin cancelled the operation.
  info: <gray>Owns <white>{owned}</white> cosmetics (<white>{limited}</white> timed), equips <white>{equipped}</white>
    regular slots, and selects <white>{weapons}</white> weapon skins.
profile:
  load-failed: <red>Your cosmetic profile could not be loaded. Reconnect or contact an administrator.
gui:
  back-failed: <!i><red>Could not open the previous menu. Please contact an administrator.
  layout-usage: '<!i><yellow>Menu size: /fc layout compact or /fc layout standard.'
  layout-unavailable: <!i><yellow>FutureUI is not enabled for this menu by the administrator.
  title: <!i><dark_gray>Fotia Cosmetics <gray>Page {page}/{pages}
  weapon-title: <!i><dark_gray>Weapon Skins <gray>Page {page}/{pages}
  loading: <red>Your profile is still loading.
  preview-unavailable: <!i>Preview unavailable; selection applies to newly created weapons on the game server.
  legendary-locked: <!i>Legendary skin changes are not allowed during this match.
  legendary-usage: '<!i>Usage: /fc legendary [weapon ID]'
  legendary-selected: <!i>Saved {cosmetic}; newly created weapons of this kind will use this skin.
  legendary-reset: <!i>Restored the default appearance selection for this weapon.
category:
  head: <!i><gold>Hats
  chest: <!i><gold>Chest
  legs: <!i><gold>Legs
  feet: <!i><gold>Feet
  back: <!i><gold>Back
  off_hand: <!i><gold>Off Hand
  balloon: <!i><gold>Balloons
  weapons: <!i><gold>Weapon Skins
weapon:
  sword: Sword
  bow: Bow
  axe: Axe
  pickaxe: Pickaxe
  crossbow: Crossbow
  mace: Mace
  spear: Spear
  trident: Trident
  shield: Shield
weapon-tab:
  name: <!i><aqua>{weapon}
cosmetic:
  available:
    name: <!i><green>{name}
    action: <!i><gray>Click to select
  equipped:
    name: <!i><gold>{name}
    action: <!i><yellow>Currently selected
  locked:
    name: <!i><red>{name}
    action: <!i><gray>You do not own this cosmetic
  hidden:
    name: <!i><dark_gray>{name}
    action: <!i><gray>This type is hidden on this server or world
control:
  weapon-previous:
    enabled: <!i><yellow>Previous Weapon Types
    disabled: <!i><dark_gray>No Previous Weapon Types
  weapon-next:
    enabled: <!i><yellow>Next Weapon Types
    disabled: <!i><dark_gray>No Next Weapon Types
  previous:
    enabled: <!i><yellow>Previous Page
    disabled: <!i><dark_gray>No Previous Page
  next:
    enabled: <!i><yellow>Next Page
    disabled: <!i><dark_gray>No Next Page
  unequip:
    enabled: <!i><red>Unequip Current Cosmetic
    disabled: <!i><dark_gray>Nothing Equipped
  back: <!i><yellow>Back to Cosmetics
  close: <!i><red>Close
feedback:
  equipped: <green>Selected cosmetic <white>{cosmetic}</white>.
  unequipped: <green>Unequipped the <white>{target}</white> cosmetic.
  locked: <red>You do not own that cosmetic.
  hidden: <yellow>This cosmetic type is hidden on the current server or world.
  storage-error: <red>Saving failed, so this change was rolled back.
  expired: <yellow>Timed cosmetic <white>{cosmetic}</white> expired and was unequipped.
navigation:
  back: <!i><yellow>Back to previous menu
  main: <!i><gold>Cosmetics
  weapons: <!i><gold>Weapons
  legendary: <!i><gold>Legendary weapons
  category-previous: <!i><gold>Previous categories
  category-next: <!i><gold>Next categories
  reset: <!i><gold>Restore default appearance
  default-selected: <!i><gold>Default appearance selected
legendary:
  lava_sword: <!i><gold>Lava Sword
  chainsaw: <!i><gold>Chainsaw
  emerald_sword: <!i><gold>Emerald Sword
  dragon_sword: <!i><gold>Ender Dragon Sword
  armadillo_cannon: <!i><gold>Armadillo Cannon
  toxic_crossbow: <!i><gold>Toxic Crossbow
  puffer_cannon: <!i><gold>Pufferfish Cannon
  sonic_crossbow: <!i><gold>Sonic Crossbow
  guardian_cannon: <!i><gold>Guardian Cannon
  bee_gun: <!i><gold>Bee Gun
  poseidon_trident: <!i><gold>Poseidon Trident

skin-ownership:
  owned: "<!i><green>Owned"
  unowned: "<!i><red>Not owned"
  selected: "<!i><gold>Owned · Selected"
  open: "<!i><yellow>View skins"
  collection: "<!i><gray>Owned skins: {owned}/{total}"
