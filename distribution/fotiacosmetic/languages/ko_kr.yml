# 所有菜单文本支持 MiniMessage 和旧颜色码；请保留占位符。
prefix: '<gray>[<gold>FotiaCosmetic</gold>]</gray> '
general:
  not-ready: <red>코스메틱 시스템을 초기화하는 중입니다. 잠시 후 다시 시도하세요.
  no-permission: <red>이 작업을 수행할 권한이 없습니다.
  player-only: <red>이 명령어는 플레이어만 사용할 수 있습니다.
  player-not-found: <red>플레이어 <white>{player}</white>을(를) 찾을 수 없습니다.
  cosmetic-not-found: <red>코스메틱 <white>{cosmetic}</white>을(를) 찾을 수 없습니다.
  invalid-target: '<red>잘못된 슬롯 또는 무기 유형입니다: <white>{target}</white>.'
  cosmetic-target-mismatch: <red><white>{cosmetic}</white>은(는) <white>{actual}</white> 대상이며 <white>{expected}</white>
    대상으로 사용할 수 없습니다.
  invalid-duration: <red>기간 <white>{duration}</white>이(가) 올바르지 않습니다. permanent, 1h, 1d12h, 7d 또는 ISO-8601 시각을 사용하세요.
  operation-failed: '<red>작업 실패: <white>{reason}</white>.'
  reload-success: <green>설정, 언어, 카탈로그와 메뉴를 다시 불러왔습니다.
  reload-failed: <red>다시 불러오지 못했습니다. 콘솔의 정확한 설정 경로를 확인하세요.
command:
  management-help: '<yellow>/fc</yellow>로 메뉴를 엽니다. 지급: <yellow>/fc grant [player|*] [slot|weapon] [slot|weapon-type]
    [ID] [permanent|1h|1d]</yellow>. revoke/equip도 같은 대상을 사용하며 unequip은 ID를 생략합니다.'
  grant-success: <green><white>{player}</white>에게 <white>{cosmetic}</white>을(를) 지급했습니다.
  grant-limited-success: <green><white>{player}</white>에게 <white>{cosmetic}</white>을(를) <white>{duration}</white>
    동안 지급했습니다.
  grant-all-success: '<green>알려진 모든 플레이어에게 <white>{cosmetic}</white>을(를) 지급했습니다: 전체 {total}, 갱신 {updated}, 변경 없음
    {unchanged}, 실패 {failed}.'
  grant-all-limited-success: '<green>알려진 모든 플레이어에게 <white>{cosmetic}</white>을(를) {duration} 동안 지급했습니다: 전체 {total},
    갱신 {updated}, 변경 없음 {unchanged}, 실패 {failed}.'
  revoke-success: <green><white>{player}</white>에게서 <white>{cosmetic}</white>을(를) 회수했습니다.
  equip-success: <green><white>{player}</white>에게 <white>{cosmetic}</white>을(를) 선택했습니다.
  unequip-success: <green><white>{player}</white>의 <white>{target}</white> 코스메틱을 해제했습니다.
  already-owned: <yellow>플레이어가 이미 해당 코스메틱을 보유하고 있습니다.
  not-owned: <red>플레이어가 해당 코스메틱을 보유하지 않았습니다.
  not-selected: <yellow>해당 대상에 선택된 코스메틱이 없습니다.
  cancelled: <yellow>다른 플러그인이 작업을 취소했습니다.
  info: <gray>보유 <white>{owned}</white>개(기간제 <white>{limited}</white>개), 일반 장착 <white>{equipped}</white>, 무기 스킨
    <white>{weapons}</white>.
profile:
  load-failed: <red>코스메틱 프로필을 불러오지 못했습니다. 다시 접속하거나 관리자에게 문의하세요.
gui:
  back-failed: <!i><red>이전 메뉴를 열 수 없습니다. 관리자에게 문의하세요.
  layout-usage: '<!i><yellow>메뉴 크기: /fc layout compact 또는 /fc layout standard.'
  layout-unavailable: <!i><yellow>관리자가 이 메뉴에 FutureUI를 활성화하지 않았습니다.
  title: <!i><dark_gray>Fotia Cosmetics <gray>{page}/{pages} 페이지
  weapon-title: <!i><dark_gray>무기 스킨 <gray>{page}/{pages} 페이지
  loading: <red>프로필을 불러오는 중입니다.
  preview-unavailable: <!i>미리 보기 없음. 게임 서버에서 새로 생성되는 무기에 적용됩니다.
  legendary-locked: <!i>이번 경기에서는 전설 무기 외형을 변경할 수 없습니다.
  legendary-usage: '<!i>사용법: /fc legendary [무기 ID]'
  legendary-selected: <!i>{cosmetic} 저장됨. 새로 생성되는 같은 종류의 무기에 적용됩니다.
  legendary-reset: <!i>이 무기의 외형 선택을 기본값으로 복원했습니다.
