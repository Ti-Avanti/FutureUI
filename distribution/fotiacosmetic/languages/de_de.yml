# 所有菜单文本支持 MiniMessage 和旧颜色码；请保留占位符。
prefix: '<gray>[<gold>FotiaCosmetic</gold>]</gray> '
general:
  not-ready: <red>Das Kosmetiksystem wird noch initialisiert. Bitte versuche es gleich erneut.
  no-permission: <red>Du hast keine Berechtigung für diese Aktion.
  player-only: <red>Dieser Befehl kann nur von Spielern verwendet werden.
  player-not-found: <red>Spieler <white>{player}</white> wurde nicht gefunden.
  cosmetic-not-found: <red>Kosmetik <white>{cosmetic}</white> wurde nicht gefunden.
  invalid-target: '<red>Ungültiger Platz oder Waffentyp: <white>{target}</white>.'
  cosmetic-target-mismatch: <red><white>{cosmetic}</white> gehört zu <white>{actual}</white>, nicht zu <white>{expected}</white>.
  invalid-duration: <red>Ungültige Dauer <white>{duration}</white>. Nutze permanent, 1h, 1d12h, 7d oder einen ISO-8601-Zeitpunkt.
  operation-failed: '<red>Aktion fehlgeschlagen: <white>{reason}</white>.'
  reload-success: <green>Konfiguration, Sprachen, Katalog und Menü wurden neu geladen.
  reload-failed: <red>Neuladen fehlgeschlagen. Prüfe den genauen Konfigurationspfad in der Konsole.
command:
  management-help: '<yellow>/fc</yellow> öffnet das Menü; Vergabe: <yellow>/fc grant [Spieler|*] [slot|weapon] [Platz|Waffentyp]
    [ID] [permanent|1h|1d]</yellow>; revoke/equip nutzen dieselben Zielangaben, unequip lässt die ID weg.'
  grant-success: <green><white>{cosmetic}</white> wurde <white>{player}</white> gegeben.
  grant-limited-success: <green><white>{cosmetic}</white> wurde <white>{player}</white> für <white>{duration}</white>
    gegeben.
  grant-all-success: '<green><white>{cosmetic}</white> wurde allen bekannten Spielern gegeben: {total} gesamt, {updated}
    aktualisiert, {unchanged} unverändert, {failed} fehlgeschlagen.'
  grant-all-limited-success: '<green><white>{cosmetic}</white> wurde allen bekannten Spielern für {duration} gegeben:
    {total} gesamt, {updated} aktualisiert, {unchanged} unverändert, {failed} fehlgeschlagen.'
  revoke-success: <green><white>{cosmetic}</white> wurde <white>{player}</white> entzogen.
  equip-success: <green><white>{cosmetic}</white> wurde für <white>{player}</white> ausgewählt.
  unequip-success: <green>Die Kosmetik <white>{target}</white> von <white>{player}</white> wurde entfernt.
  already-owned: <yellow>Der Spieler besitzt diese Kosmetik bereits.
  not-owned: <red>Der Spieler besitzt diese Kosmetik nicht.
  not-selected: <yellow>Für dieses Ziel ist keine Kosmetik ausgewählt.
  cancelled: <yellow>Ein anderes Plugin hat die Aktion abgebrochen.
  info: <gray>Besitzt <white>{owned}</white> Kosmetiken (<white>{limited}</white> zeitlich begrenzt), trägt <white>{equipped}</white>
    normale Plätze und nutzt <white>{weapons}</white> Waffenskins.
profile:
  load-failed: <red>Dein Kosmetikprofil konnte nicht geladen werden. Verbinde dich neu oder kontaktiere einen Administrator.
gui:
  back-failed: <!i><red>Das vorherige Menü konnte nicht geöffnet werden. Bitte kontaktiere einen Administrator.
  layout-usage: '<!i><yellow>Menügröße: /fc layout compact oder /fc layout standard.'
  layout-unavailable: <!i><yellow>FutureUI ist für dieses Menü nicht aktiviert.
  title: <!i><dark_gray>Fotia Kosmetik <gray>Seite {page}/{pages}
  weapon-title: <!i><dark_gray>Waffen-Skins <gray>Seite {page}/{pages}
  loading: <red>Dein Profil wird noch geladen.
  preview-unavailable: <!i>Keine Vorschau; die Auswahl gilt für neu erstellte Waffen auf dem Spielserver.
  legendary-locked: <!i>Legendäre Skins können in diesem Match nicht geändert werden.
  legendary-usage: '<!i>Verwendung: /fc legendary [Waffen-ID]'
  legendary-selected: <!i>{cosmetic} gespeichert; neu erstellte Waffen dieses Typs verwenden diesen Skin.
  legendary-reset: <!i>Standardaussehen für diese Waffe wiederhergestellt.
