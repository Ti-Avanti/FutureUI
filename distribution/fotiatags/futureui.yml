# 显示引擎在 menus/<菜单名>.yml 中使用 ui-engine: inventory / futureui 选择。
# 本文件只配置 FutureUI 布局与图片，不另建或发送资源包。
default-layout: standard
layouts:
  standard:
    menu: fotiatags/standard
    # 修改每页数量时同步调整 FutureUI 菜单模板。
    page-size: 4
  compact:
    menu: fotiatags/compact
    page-size: 2
input-menu: fotiatags/input
icons:
  # 图片 ID 必须在 FutureUI/assets/images.yml 或 images/*.yml 中注册。
  fallback: paper
  # 键支持 tag/<称号ID>、icon/<自定义图标ID>、effect/<效果ID>。
  # item-model 和 CustomModelData 不会自动转换成 Canvas 图片。
  entries:
    icon/nametag: name_tag
    icon/diamond: diamond
    icon/emerald: emerald
    effect/aurora: amethyst_shard
    effect/ocean: heart_of_the_sea
    effect/royal: gold_ingot
