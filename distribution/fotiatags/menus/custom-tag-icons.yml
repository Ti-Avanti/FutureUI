# 玩家菜单显示引擎：inventory / futureui；未安装 FutureUI 时保留原菜单。
ui-engine: futureui

# 自定义称号图标选择菜单

title: "<gold><!i>选择称号图标"
size: 45

# 图标会按 icon-slots 顺序填充。
# X = 图标填充槽
# H = 说明
# D = 装饰物品
layout:
  - "DDDDHDDDD"
  - "DXXXXXXXD"
  - "DXXXXXXXD"
  - "DXXXXXXXD"
  - "DDDDBDDDD"

icon-slots:
  - 10
  - 11
  - 12
  - 13
  - 14
  - 15
  - 16
  - 19
  - 20
  - 21
  - 22
  - 23
  - 24
  - 25
  - 28
  - 29
  - 30
  - 31
  - 32
  - 33
  - 34

items:
  D:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    lore: []

  H:
    material: NAME_TAG
    name: "<gold><!i>选择称号图标"
    lore:
      - "<gray>图标只影响称号仓库中的展示物品"
      - "<gray>不会改变聊天和头顶称号文字"

  B:
    material: ARROW
    name: "<yellow><!i>返回"
    lore:
      - "<gray>点击返回自定义称号菜单"
    action: back-edit

icon-item:
  name: "%icon_name%"
  lore:
    - "<gray>ID: %icon_id%"
    - "<gray>选中后返回自定义称号菜单"
    - ""
    - "<yellow>点击选择此图标"
