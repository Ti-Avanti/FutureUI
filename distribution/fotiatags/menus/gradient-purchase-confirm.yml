# 玩家菜单显示引擎：inventory / futureui；未安装 FutureUI 时保留原菜单。
ui-engine: futureui

# 动态效果购买确认菜单
title: "<!i><gold>确认购买动态效果"
size: 27

layout:
  - "XXXXXXXXX"
  - "XXY E NXX"
  - "XXXXXXXXX"

# 预览物品所在槽位
effect-slots:
  - 13

items:
  X:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  Y:
    material: LIME_CONCRETE
    name: "<green><!i>确认购买"
    lore:
      - "<gray>价格: %price%"
      - ""
      - "<yellow>点击后立即扣款"
    action: confirm-buy
  N:
    material: RED_CONCRETE
    name: "<red><!i>取消"
    lore:
      - "<gray>返回动态效果商店"
    action: cancel

effect-item:
  selected:
    material: NAME_TAG
    use-effect-icon: true
    name: "<white><!i>%effect_name%"
    lore:
      - "<gray>ID: %effect_id%"
      - "<gray>预览: %effect_preview%"
      - "<gray>购买时长: %duration%"
      - "<gray>支付方式: %provider%"
      - "<gray>价格: %price%"
    glow: true
  unselected:
    material: NAME_TAG
    use-effect-icon: true
    name: "<white><!i>%effect_name%"
    lore:
      - "<gray>ID: %effect_id%"
      - "<gray>预览: %effect_preview%"
      - "<gray>购买时长: %duration%"
      - "<gray>支付方式: %provider%"
      - "<gray>价格: %price%"
    glow: true
