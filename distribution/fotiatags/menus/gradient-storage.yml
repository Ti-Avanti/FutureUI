# 玩家菜单显示引擎：inventory / futureui；未安装 FutureUI 时保留原菜单。
ui-engine: futureui

# 玩家已拥有的动态效果仓库
title: "<!i><gradient:#FFD700:#55FFFF>动态效果仓库</gradient> <gray>(%page%/%total_pages%)"
size: 54

layout:
  - "XXXXXXXXX"
  - "X       X"
  - "X       X"
  - "X       X"
  - "X       X"
  - "PXXCSXXNX"

effect-slots:
  - 10
  - 11
  - 12
  - 13
  - 14
  - 15
  - 16
  - 19
  - 20
  - 21
  - 22
  - 23
  - 24
  - 25
  - 28
  - 29
  - 30
  - 31
  - 32
  - 33
  - 34
  - 37
  - 38
  - 39
  - 40
  - 41
  - 42
  - 43

items:
  X:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  P:
    material: ARROW
    name: "<yellow><!i>上一页"
    lore:
      - "<gray>当前: %page%/%total_pages%"
    action: prev-page
  N:
    material: ARROW
    name: "<yellow><!i>下一页"
    lore:
      - "<gray>当前: %page%/%total_pages%"
    action: next-page
  C:
    material: BARRIER
    name: "<red><!i>取消动态效果"
    lore:
      - "<gray>当前: %selected_effect%"
      - ""
      - "<yellow>点击取消使用"
    action: clear
  S:
    material: EMERALD
    name: "<aqua><!i>动态效果商店"
    lore:
      - "<gray>购买 Vault 或 PlayerPoints 效果"
      - ""
      - "<yellow>点击打开"
    action: shop

effect-item:
  selected:
    material: NAME_TAG
    use-effect-icon: true
    name: "<green><!i>%effect_name% <gray>(使用中)"
    lore:
      - "<gray>ID: %effect_id%"
      - "<gray>预览: %effect_preview%"
      - "<gray>剩余: %expire%"
      - "<gray>颜色: %colors%"
      - ""
      - "<yellow>点击取消使用"
    glow: true
  unselected:
    material: NAME_TAG
    use-effect-icon: true
    name: "<white><!i>%effect_name%"
    lore:
      - "<gray>ID: %effect_id%"
      - "<gray>预览: %effect_preview%"
      - "<gray>剩余: %expire%"
      - "<gray>颜色: %colors%"
      - ""
      - "<yellow>点击选择"
    glow: false
