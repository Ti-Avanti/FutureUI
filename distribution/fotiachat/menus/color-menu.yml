# FotiaChat 颜色选择菜单
# GUI配置文件
#
# 物品显示配置说明:
#   material: 原版物品材质
#   craftengine-item: CraftEngine自定义物品ID（可选，优先于material）
#                     格式: namespace:item_id
#   item_model: 物品模型（1.21.4+）
#   model_data: CustomModelData值（用于旧版资源包）
#   tooltip: 提示框样式（1.21.4+）
#   name: 物品名称
#   lore: 物品描述

# 管理员选择显示引擎；缺少 FutureUI 或客户端不支持时使用原界面。
# FutureUI 颜色列表读取 colors.yml；下方 Layout/Icons 继续用于原箱子菜单。
ui-engine: futureui
futureui:
  menu: fotiachat/colors
  page-size: 9
  default-layout: standard
  show-locked: true
  # 支持 lang: 语言键；预览只展示文字，不会发送聊天消息。
  preview-text: lang:color.preview-text
  compact:
    menu: fotiachat/colors_compact
    page-size: 4

Title: '<!i><gradient:#FF6B6B:#4ECDC4>聊天颜色选择</gradient>'
Title-Key: "menus.color.title"

Layout:
  - '#########'
  - '#abcdefg#'
  - '#hijklmn#'
  - '#opqrstu#'
  - '####x####'

Icons:
  '#':
    display:
      material: 'GRAY_STAINED_GLASS_PANE'
      name: '<!i><dark_gray> '
      lore: []
    actions:
      left,right:
        actions: []

  'a':
    display:
      material: 'WHITE_DYE'
      name: '<!i><white>白色</white>'
      Name-Key: "colors.white"
      lore:
        - '<!i><gray>点击选择此颜色'
        - ''
        - '<!i><white>预览: 这是白色文字</white>'
      Lore-Keys:
        - "menus.color.select"
        - "menus.common.blank"
        - "menus.color.preview.white"
    actions:
      left,right:
        actions:
          - 'sound: BLOCK_NOTE_BLOCK_PLING-1-2'
          - 'set_color: white'
          - 'refresh'

