# 导航栏目与当前页面分别绑定，子功能页可返回栏目主页。
id: navigation
type: column
gap: 0
children:
- id: nav_home
  type: button
  text: '@menus.demo.nav.home'
  height: 27
  actions:
  - type: open-menu
    menu: demo_home
  icon: demo_stone
  icon-size: 9
  icon-gap: 6
  text-align: start
  padding: 9
  states:
  - visible:
      type: all
      conditions:
      - type: equals
        input: '{demo.section}'
        output: home
      - type: equals
        input: '{demo.page}'
        output: demo_home
    skin: selected
    text: '@menus.demo.nav.selected-home'
    actions:
    - type: refresh
  - visible:
      type: equals
      input: '{demo.section}'
      output: home
    skin: selected
    text: '@menus.demo.nav.selected-home'
  - visible: true
    skin: navigation
