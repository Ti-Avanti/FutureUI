# FutureUI Skill 示例增量；共享配置需按键合并，勿整体覆盖服务器配置。
id: category_button
type: button
height: 27
text: '{item.name}'
states:
- priority: 0
  visible:
    type: equals
    input: '{item.selected}'
    output: 'true'
  skin: selected
- priority: 1
  visible: true
  skin: button
actions:
- type: if
  when:
    type: equals
    input: '{item.selected}'
    output: 'true'
  then:
  - type: list
    key: category
    value: '{item.selected-categories}'
    operation: remove
    item: '{item.id}'
  else:
  - type: list
    key: category
    value: '{item.selected-categories}'
    operation: append
    item: '{item.id}'
- type: page
  absolute: 0
