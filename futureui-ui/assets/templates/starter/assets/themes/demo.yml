# 独立示例配置；先核对目标版本，再按文件或配置键合并。
skin-aliases:
  surface: panel
  header: panel
  well: readout
  quantity: readout
  navigation: button
  purchase: selected
  disabled: readout
canvas:
  image-sizes:
  - 9
  - 18
  background:
    enabled: false
    color: '#292b2d'
  interaction:
    cover-focus-outline: false
    outline-color: '#292b2d'
    hover: true
    hover-heights:
    - 18
    - 27
    - 36
    pointer-descriptions: false
  styles:
    panel:
      fill: '#595a5b'
      light: '#858687'
      shadow: '#3b3d3e'
      outline: '#3b3d3e'
      shadow-depth: 0
    button:
      fill: '#595a5b'
      light: '#929394'
      shadow: '#363839'
      outline: '#292b2d'
      shadow-depth: 0
      hover:
        fill: '#63c74a'
        opacity: 220
        outline: '#d5f4bb'
    selected:
      fill: '#60bd43'
      light: '#c6eaa9'
      shadow: '#397529'
      outline: '#233f1b'
      shadow-depth: 0
      hover:
        fill: '#a9e58d'
        opacity: 100
        outline: '#e2f9c9'
    readout:
      bevel: false
      shadow-depth: 0
      fill: '#3d3f41'
      outline: '#292b2d'
      hover:
        fill: '#63c74a'
        opacity: 160
        outline: '#d5f4bb'
    switch-thumb:
      fill: '#bfc1c2'
      light: '#e3e5e6'
      shadow: '#898c8f'
      outline: '#25282a'
      shadow-depth: 0
      hover:
        fill: '#ffffff'
        opacity: 28
        outline: '#e5ebdf'
native-widgets:
  background:
    enabled: true
    color: '#595a5b'
