# 导航栏目与当前页面分别绑定，子功能页可返回栏目主页。
id: demo_variables
template: demo_workspace
title: '@menus.demo.variables.title'
bindings:
  demo.section:
    value: logic
  demo.page:
    value: demo_variables
components:
- id: workspace
  type: row
  gap: 9
  children:
  - template: demo_navigation
  - id: content
    type: column
    gap: 9
    children:
    - id: values
      type: column
      gap: 9
      children:
      - id: title
        type: text
        text: '@menus.demo.variables.title'
        height: 9
      - id: literal
        type: text
        text: '@menus.demo.variables.literal'
        height: 45
        skin: readout
        padding: 9
      - id: resolved
        type: text
        text: '@menus.demo.variables.resolved'
        height: 45
        skin: readout
        padding: 9
        visible:
          type: plugin
          plugin: PlaceholderAPI
      - id: missing
        type: text
        text: '@menus.demo.variables.missing'
        height: 27
        visible:
          type: not
          condition:
            type: plugin
            plugin: PlaceholderAPI
      skin: surface
      padding: 9
    - id: controls
      type: column
      gap: 9
      children:
      - id: rounds
        type: text
        text: '@menus.demo.variables.help'
        height: 45
      - id: resolve
        type: button
        text: '@menus.demo.variables.resolve'
        height: 27
        actions:
        - type: message
          text: '@menus.demo.variables.result'
          parse:
            mode: recursive
            max-rounds: 5
            order: local-first
            expand-input: false
        enabled:
          type: plugin
          plugin: PlaceholderAPI
      skin: surface
      padding: 9
defaults:
  demo.currency: vault
  demo.token: '%futureui_balance_{demo.currency}%'
  demo.chain: '{demo.token}'
