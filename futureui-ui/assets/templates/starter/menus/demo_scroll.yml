id: demo_scroll
renderer: canvas
title: '@menus.demo.scroll.title'
permission: futureui.use
layout:
  type: column
  width: 540
  gap: 9
  padding: 0
  theme: demo
  exit-button: false
components:
- id: title
  type: text
  text: '@menus.demo.scroll.title'
  height: 27
  skin: readout
  text-align: center
  vertical-align: center
- id: gallery
  type: viewport
  region: demo_scroll
  height: 81
  visible-items: 3
  direction: left
  gap: 9
  motion:
    from: 0
    to: 5
    duration-ticks: 120
    interval-ticks: 1
    easing: linear
    loop: true
  children:
  - id: card_0
    type: column
    gap: 0
    skin: panel
    children:
    - id: icon_0
      type: image
      image: demo_stone
      size: 36
      height: 54
    - id: name_0
      type: text
      text: '@menus.demo.scroll.stone'
      height: 27
      text-align: center
      vertical-align: center
  - id: card_1
    type: column
    gap: 0
    skin: panel
    children:
    - id: icon_1
      type: image
      image: demo_planks
      size: 36
      height: 54
    - id: name_1
      type: text
      text: '@menus.demo.scroll.planks'
      height: 27
      text-align: center
      vertical-align: center
  - id: card_2
    type: column
    gap: 0
    skin: panel
    children:
    - id: icon_2
      type: image
      image: demo_glass
      size: 36
      height: 54
    - id: name_2
      type: text
      text: '@menus.demo.scroll.glass'
      height: 27
      text-align: center
      vertical-align: center
  - id: card_3
    type: column
    gap: 0
    skin: panel
    children:
    - id: icon_3
      type: image
      image: demo_sandstone
      size: 36
      height: 54
    - id: name_3
      type: text
      text: '@menus.demo.scroll.sandstone'
      height: 27
      text-align: center
      vertical-align: center
  - id: card_4
    type: column
    gap: 0
    skin: panel
    children:
    - id: icon_4
      type: image
      image: demo_bread
      size: 36
      height: 54
    - id: name_4
      type: text
      text: '@menus.demo.scroll.bread'
      height: 27
      text-align: center
      vertical-align: center
  - id: card_5
    type: column
    gap: 0
    skin: panel
    children:
    - id: icon_5
      type: image
      image: demo_stone
      size: 36
      height: 54
    - id: name_5
      type: text
      text: '@menus.demo.scroll.stone'
      height: 27
      text-align: center
      vertical-align: center
  - id: card_6
    type: column
    gap: 0
    skin: panel
    children:
    - id: icon_6
      type: image
      image: demo_planks
      size: 36
      height: 54
    - id: name_6
      type: text
      text: '@menus.demo.scroll.planks'
      height: 27
      text-align: center
      vertical-align: center
  - id: card_7
    type: column
    gap: 0
    skin: panel
    children:
    - id: icon_7
      type: image
      image: demo_glass
      size: 36
      height: 54
    - id: name_7
      type: text
      text: '@menus.demo.scroll.glass'
      height: 27
      text-align: center
      vertical-align: center
- id: controls
  type: row
  gap: 9
  children:
  - id: restart
    type: button
    text: '@menus.demo.scroll.restart'
    actions:
    - type: open-menu
      menu: demo_scroll
  - id: close
    type: button
    text: '@menus.demo.scroll.close'
    actions:
    - type: close
