# 导航栏目与当前页面分别绑定，子功能页可返回栏目主页。
id: demo_recycle
template: demo_workspace
title: '@menus.demo.recycle.title'
bindings:
  demo.section:
    value: services
  demo.page:
    value: demo_recycle
components:
- id: workspace
  type: row
  gap: 9
  children:
  - template: demo_navigation
  - id: content
    type: column
    gap: 9
    children:
    - id: heading
      type: column
      gap: 9
      children:
      - id: title
        type: text
        text: '@menus.demo.recycle.title'
        height: 9
      - id: description
        type: text
        text: '@menus.demo.recycle.description'
        height: 27
      skin: surface
      padding: 9
    - id: products
      type: list
      source: sell-products
      cache: false
      page-size: 2
      layout:
        type: grid
        columns: 2
        gap: 9
        min-height: 135
      item:
        id: product
        type: column
        gap: 9
        children:
        - id: name
          type: text
          text: '{item.name}'
          height: 9
        - id: price
          type: text
          text: '@menus.demo.recycle.price'
          height: 45
          skin: readout
          padding: 9
        - id: sell
          type: button
          text: '@menus.demo.recycle.sell'
          height: 27
          actions:
          - type: sell
            shop: '{item.shop}'
            product: '{item.id}'
            quantity: 1
            quoted-price: '{item.price}'
            on-success:
            - type: message
              text: '@menus.demo.recycle.sold'
          enabled:
            type: equals
            input: '{item.available}'
            output: 'true'
        skin: surface
        padding: 9
    - id: pager
      type: row
      gap: 9
      children:
      - id: previous
        type: button
        text: '@common.previous'
        height: 27
        actions:
        - type: page
          offset: -1
      - id: page
        type: text
        text: '{page} / {pages}'
        height: 27
        skin: readout
        padding: 9
        text-align: center
      - id: next
        type: button
        text: '@common.next'
        height: 27
        actions:
        - type: page
          offset: 1
defaults:
  shop: demo
