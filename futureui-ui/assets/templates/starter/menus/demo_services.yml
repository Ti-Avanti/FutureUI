# 导航栏目与当前页面分别绑定，子功能页可返回栏目主页。
id: demo_services
template: demo_workspace
title: '@menus.demo.services.title'
bindings:
  demo.section:
    value: services
  account.balance:
    type: currency
    currency: vault
  demo.page:
    value: demo_services
components:
- id: workspace
  type: row
  gap: 9
  children:
  - template: demo_navigation
  - id: content
    type: column
    gap: 9
    children:
    - id: services_intro
      type: column
      gap: 9
      children:
      - id: heading
        type: text
        text: '@menus.demo.services.title'
        height: 9
      - id: balance
        type: text
        text: '@menus.demo.services.balance'
        height: 27
        skin: readout
        padding: 9
      skin: surface
      padding: 9
    - id: service_links
      type: column
      gap: 9
      children:
      - id: links
        type: grid
        columns: 2
        gap: 9
        children:
        - id: service_cart
          type: button
          text: '@menus.demo.cart.title'
          height: 27
          actions:
          - type: open-menu
            menu: demo_cart
        - id: service_recycle
          type: button
          text: '@menus.demo.recycle.title'
          height: 27
          actions:
          - type: open-menu
            menu: demo_recycle
        - id: service_input
          type: button
          text: '@menus.demo.input.title'
          height: 27
          actions:
          - type: open-menu
            menu: demo_input
        - id: service_variables
          type: button
          text: '@menus.demo.variables.title'
          height: 27
          actions:
          - type: open-menu
            menu: demo_variables
        - id: service_logic
          type: button
          text: '@menus.demo.logic.title'
          height: 27
          actions:
          - type: open-menu
            menu: demo_logic
        - id: service_settings
          type: button
          text: '@menus.demo.settings.title'
          height: 27
          actions:
          - type: open-menu
            menu: demo_settings
      - id: shop
        type: button
        text: '@menus.demo.home.shop'
        height: 27
        actions:
        - type: open-menu
          menu: demo_shop
        skin: purchase
      skin: surface
      padding: 9
