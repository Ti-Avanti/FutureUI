# 导航栏目与当前页面分别绑定，子功能页可返回栏目主页。
id: demo_input
template: demo_workspace
title: '@menus.demo.input.title'
bindings:
  demo.section:
    value: services
  demo.page:
    value: demo_input
components:
- id: workspace
  type: row
  gap: 9
  children:
  - template: demo_navigation
  - id: content
    type: column
    gap: 9
    children:
    - id: note_panel
      type: column
      gap: 9
      children:
      - id: title
        type: text
        text: '@menus.demo.input.title'
        height: 9
      - id: note
        type: text
        text: '@menus.demo.input.current'
        height: 72
        skin: readout
        padding: 9
      skin: surface
      padding: 9
    - id: methods_panel
      type: column
      gap: 9
      children:
      - id: help
        type: text
        text: '@menus.demo.input.help'
        height: 27
      - id: methods
        type: grid
        columns: 2
        gap: 9
        children:
        - id: input_dialog
          type: button
          text: '@menus.demo.input.dialog'
          height: 27
          actions:
          - type: input
            mode: dialog
            key: input.demo_note
            prompt: '@menus.demo.input.prompt'
            initial: '{data.input.demo_note}'
            max-length: 128
            timeout-seconds: 60
            on-cancel:
            - type: message
              text: '@menus.demo.input.cancelled'
            - type: open-menu
              menu: demo_input
            on-timeout:
            - type: message
              text: '@menus.demo.input.timeout'
            - type: open-menu
              menu: demo_input
          - type: save-preference
            key: input.demo_note
            value: '{input.demo_note}'
          - type: message
            text: '@menus.demo.input.saved'
          - type: open-menu
            menu: demo_input
        - id: input_chat
          type: button
          text: '@menus.demo.input.chat'
          height: 27
          actions:
          - type: input
            mode: chat
            key: input.demo_note
            prompt: '@menus.demo.input.prompt'
            initial: '{data.input.demo_note}'
            max-length: 128
            timeout-seconds: 60
            on-cancel:
            - type: message
              text: '@menus.demo.input.cancelled'
            - type: open-menu
              menu: demo_input
            on-timeout:
            - type: message
              text: '@menus.demo.input.timeout'
            - type: open-menu
              menu: demo_input
          - type: save-preference
            key: input.demo_note
            value: '{input.demo_note}'
          - type: message
            text: '@menus.demo.input.saved'
          - type: open-menu
            menu: demo_input
        - id: input_sign
          type: button
          text: '@menus.demo.input.sign'
          height: 27
          actions:
          - type: input
            mode: sign
            key: input.demo_note
            prompt: '@menus.demo.input.prompt'
            initial: '{data.input.demo_note}'
            max-length: 128
            timeout-seconds: 60
            on-cancel:
            - type: message
              text: '@menus.demo.input.cancelled'
            - type: open-menu
              menu: demo_input
            on-timeout:
            - type: message
              text: '@menus.demo.input.timeout'
            - type: open-menu
              menu: demo_input
          - type: save-preference
            key: input.demo_note
            value: '{input.demo_note}'
          - type: message
            text: '@menus.demo.input.saved'
          - type: open-menu
            menu: demo_input
        - id: input_anvil
          type: button
          text: '@menus.demo.input.anvil'
          height: 27
          actions:
          - type: input
            mode: anvil
            key: input.demo_note
            prompt: '@menus.demo.input.prompt'
            initial: '{data.input.demo_note}'
            max-length: 128
            timeout-seconds: 60
            on-cancel:
            - type: message
              text: '@menus.demo.input.cancelled'
            - type: open-menu
              menu: demo_input
            on-timeout:
            - type: message
              text: '@menus.demo.input.timeout'
            - type: open-menu
              menu: demo_input
          - type: save-preference
            key: input.demo_note
            value: '{input.demo_note}'
          - type: message
            text: '@menus.demo.input.saved'
          - type: open-menu
            menu: demo_input
        - id: input_book
          type: button
          text: '@menus.demo.input.book'
          height: 27
          actions:
          - type: input
            mode: book
            key: input.demo_note
            prompt: '@menus.demo.input.prompt'
            initial: '{data.input.demo_note}'
            max-length: 128
            timeout-seconds: 60
            on-cancel:
            - type: message
              text: '@menus.demo.input.cancelled'
            - type: open-menu
              menu: demo_input
            on-timeout:
            - type: message
              text: '@menus.demo.input.timeout'
            - type: open-menu
              menu: demo_input
          - type: save-preference
            key: input.demo_note
            value: '{input.demo_note}'
          - type: message
            text: '@menus.demo.input.saved'
          - type: open-menu
            menu: demo_input
      skin: surface
      padding: 9
