# 导航栏目与当前页面分别绑定，子功能页可返回栏目主页。
id: demo_cart
template: demo_workspace
title: '@menus.demo.cart.title'
bindings:
  demo.section:
    value: services
  demo.page:
    value: demo_cart
components:
- id: workspace
  type: row
  gap: 9
  children:
  - template: demo_navigation
  - id: content
    type: column
    gap: 9
    children:
    - id: summary
      type: column
      gap: 9
      children:
      - id: counts
        type: text
        text: '@menus.demo.cart.counts'
        height: 36
        skin: readout
        padding: 9
      - id: total
        type: text
        text: '@menus.demo.cart.total'
        height: 36
        skin: readout
        padding: 9
      - id: cart_actions
        type: row
        gap: 9
        children:
        - id: checkout
          type: button
          text: '@menus.demo.cart.checkout'
          height: 27
          actions:
          - type: cart-checkout
            on-success:
            - type: open-menu
              menu: demo_cart_receipt
          skin: purchase
          enabled:
            type: '>'
            input: '{cart.lines}'
            output: 0
        - id: clear
          type: button
          text: '@menus.demo.cart.clear'
          height: 27
          actions:
          - type: cart-clear
      skin: surface
      padding: 9
    - id: entries
      type: list
      source: cart
      cache: false
      page-size: 1
      layout:
        type: column
        gap: 9
        min-height: 126
      item:
        id: line
        type: column
        gap: 9
        children:
        - id: name
          type: text
          text: '{item.name}'
          height: 9
        - id: line_amount
          type: text
          text: '@menus.demo.cart.line'
          height: 36
          skin: readout
          padding: 9
        - id: remove
          type: button
          text: '@menus.demo.cart.remove'
          height: 27
          actions:
          - type: cart-remove
            shop: '{item.shop}'
            product: '{item.id}'
        skin: surface
        padding: 9
    - id: pager
      type: row
      gap: 9
      children:
      - id: previous
        type: button
        text: '@common.previous'
        height: 27
        actions:
        - type: page
          offset: -1
      - id: page
        type: text
        text: '{page} / {pages}'
        height: 27
        skin: readout
        padding: 9
        text-align: center
      - id: next
        type: button
        text: '@common.next'
        height: 27
        actions:
        - type: page
          offset: 1
cart-summary: true
