# 示例业务会产生真实效果；价格、物品及权限均由本配置决定。
id: demo_shop
template: demo_page
title: '@menus.demo.home.shop'
defaults:
  category: []
  shop.search: ''
  shop.sort: ''
components:
- id: header
  type: row
  gap: 18
  children:
  - id: heading
    type: text
    text: '@menus.demo.home.shop'
    height: 36
    vertical-align: center
  - id: balance
    type: text
    text: '@menus.demo.home.balance'
    skin: readout
    padding: 9
    height: 36
- id: storefront
  type: row
  gap: 18
  children:
  - id: filters
    type: column
    width: 108
    gap: 9
    children:
    - id: category_help
      type: text
      text: '@menus.demo.search.categories'
      height: 27
    - id: categories
      type: list
      source: shop-categories
      shop: demo
      paginate: false
      cache: false
      layout:
        type: column
        gap: 9
      item:
        template: demo_category
    - id: clear_filters
      type: button
      text: '@menus.demo.search.clear'
      height: 27
      actions:
      - type: set-variable
        key: shop.search
        value: ''
      - type: set-variable
        key: shop.sort
        value: ''
      - type: set-variable
        key: category
        value: []
      - type: page
        absolute: 0
  - id: products
    type: list
    source: shop-products
    shop: demo
    cache: false
    page-size: 4
    layout:
      type: grid
      columns: 2
      gap: 9
      min-height: 297
    item:
      template: demo_product
- id: footer
  type: row
  gap: 9
  children:
  - id: previous
    type: button
    width: 108
    text: '@common.previous'
    actions:
    - type: page
      offset: -1
  - id: page_number
    type: text
    skin: readout
    text: '{page} / {pages}'
    text-align: center
    vertical-align: center
    height: 27
  - id: home
    type: button
    width: 144
    text: '@menus.demo.home.title'
    actions:
    - type: open-menu
      menu: demo_home
  - id: cart
    type: button
    text: '@menus.demo.cart.title'
    height: 27
    actions:
    - type: open-menu
      menu: demo_cart
    width: 108
  - id: next
    type: button
    width: 108
    text: '@common.next'
    actions:
    - type: page
      offset: 1
bindings:
  account.balance:
    type: currency
    currency: vault
