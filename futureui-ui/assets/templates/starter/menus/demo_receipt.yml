# FutureUI Skill 示例增量；共享配置需按键合并，勿整体覆盖服务器配置。
id: demo_receipt
title: '@menus.demo.receipt.title'
components:
- id: heading
  type: text
  text: '@menus.demo.receipt.heading'
  height: 27
  vertical-align: center
- id: order
  type: row
  gap: 18
  children:
  - id: product_preview
    type: column
    width: 162
    skin: surface
    padding: 9
    gap: 9
    children:
    - id: product_image
      type: image
      image: '{product.icon}'
      fallback-image: demo_stone
      size: 144
    - id: product_name
      type: text
      text: '{product.name}'
      height: 18
      text-align: center
  - id: order_details
    type: column
    height: 189
    vertical-align: center
    gap: 9
    children:
    - id: quantities
      type: row
      gap: 9
      children:
      - id: bundles
        type: column
        skin: readout
        padding: 9
        gap: 9
        children:
        - id: bundles_label
          type: text
          text: '@menus.demo.receipt.bundles'
        - id: bundles_value
          type: text
          text: <!i><white><bold>{purchase.quantity}</bold>
          height: 18
      - id: items
        type: column
        skin: readout
        padding: 9
        gap: 9
        children:
        - id: items_label
          type: text
          text: '@menus.demo.receipt.items'
        - id: items_value
          type: text
          text: <!i><white><bold>{purchase.items}</bold>
          height: 18
    - id: payment
      type: column
      skin: readout
      padding: 9
      gap: 9
      children:
      - id: paid_label
        type: text
        text: '@menus.demo.receipt.paid'
      - id: paid_value
        type: text
        text: <!i><green><bold>{purchase.total}</bold> <gray>{product.currency}
        height: 18
    - id: remaining
      type: text
      skin: readout
      padding: 9
      text: '@menus.demo.receipt.balance'
      height: 36
- id: actions
  type: row
  gap: 9
  children:
  - id: continue
    type: button
    skin: purchase
    height: 36
    text: '@menus.demo.receipt.continue'
    actions:
    - type: open-menu
      menu: demo_shop
  - id: wallet
    type: button
    height: 36
    text: '@menus.demo.home.title'
    actions:
    - type: open-menu
      menu: demo_home
template: demo_page
