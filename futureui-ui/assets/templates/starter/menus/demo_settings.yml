# 导航栏目与当前页面分别绑定，子功能页可返回栏目主页。
id: demo_settings
template: demo_workspace
title: '@menus.demo.settings.title'
bindings:
  demo.section:
    value: settings
  demo.page:
    value: demo_settings
components:
- id: workspace
  type: row
  gap: 9
  children:
  - template: demo_navigation
  - id: content
    type: column
    gap: 9
    children:
    - id: toggles
      type: column
      gap: 9
      children:
      - id: toggles_title
        type: text
        text: '@menus.demo.settings.instant'
        height: 9
      - id: hints_row
        type: row
        gap: 9
        children:
        - id: hints_label
          type: text
          text: '@menus.demo.settings.hints'
          height: 27
          vertical-align: center
        - id: hints_control
          type: list
          width: 108
          source: static
          entries:
          - key: input.hints
            'on': '{input.hints}'
          cache: false
          paginate: false
          layout:
            type: column
            gap: 0
          item:
            template: demo_switch
      - id: notifications_row
        type: row
        gap: 9
        children:
        - id: notifications_label
          type: text
          text: '@menus.demo.settings.notifications'
          height: 27
          vertical-align: center
        - id: notifications_control
          type: list
          width: 108
          source: static
          entries:
          - key: input.notifications
            'on': '{input.notifications}'
          cache: false
          paginate: false
          layout:
            type: column
            gap: 0
          item:
            template: demo_switch
      - id: switch_help
        type: text
        text: '@menus.demo.settings.switch-help'
        height: 27
      skin: surface
      padding: 9
    - id: details
      type: column
      gap: 9
      children:
      - id: nickname
        type: text
        text: '@menus.demo.settings.current-name'
        height: 27
        skin: readout
        padding: 9
      - id: volume
        type: text
        text: '@menus.demo.settings.current-volume'
        height: 27
        skin: readout
        padding: 9
      - id: edit
        type: button
        text: '@menus.demo.settings.edit'
        height: 27
        actions:
        - type: open-menu
          menu: demo_settings_edit
      skin: surface
      padding: 9
defaults:
  input.hints: true
  input.notifications: false
  input.volume: 60
  input.nickname: '{player.name}'
  input.theme: default
