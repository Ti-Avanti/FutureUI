# 导航栏目与当前页面分别绑定，子功能页可返回栏目主页。
id: demo_logic
template: demo_workspace
title: '@menus.demo.logic.title'
bindings:
  demo.section:
    value: logic
  account.balance:
    type: currency
    currency: vault
  demo.page:
    value: demo_logic
components:
- id: workspace
  type: row
  gap: 9
  children:
  - template: demo_navigation
  - id: content
    type: column
    gap: 9
    children:
    - id: requirements
      type: column
      gap: 9
      children:
      - id: heading
        type: text
        text: '@menus.demo.logic.title'
        height: 9
      - id: description
        type: text
        text: '@menus.demo.logic.description'
        height: 45
      - id: balance
        type: text
        text: '@menus.demo.services.balance'
        height: 27
        skin: readout
        padding: 9
      - id: state
        type: text
        text: '@menus.demo.logic.locked'
        height: 27
        skin: readout
        padding: 9
        states:
        - visible:
            type: named
            rule: demo_exchange
          text: '@menus.demo.logic.ready'
        - visible: true
      skin: surface
      padding: 9
    - id: actions
      type: column
      gap: 9
      children:
      - id: choices
        type: row
        gap: 9
        children:
        - id: explain
          type: button
          text: '@menus.demo.logic.explain'
          height: 27
          actions:
          - type: if
            when:
              type: named
              rule: demo_exchange
            then:
            - type: message
              text: '@menus.demo.logic.ready'
            else:
            - type: message
              text: '@menus.demo.logic.locked'
        - id: exchange
          type: button
          text: '@menus.demo.logic.exchange'
          height: 27
          actions:
          - type: call
            function: demo_exchange
          skin: purchase
          requirements:
            type: named
            rule: demo_exchange
      - id: variables
        type: button
        text: '@menus.demo.variables.title'
        height: 27
        actions:
        - type: open-menu
          menu: demo_variables
      skin: surface
      padding: 9
