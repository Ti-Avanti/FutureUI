  heading: <!i>当前语言
  choices: <!i>选择语言
help:
  title: <!i>使用帮助
  heading: <!i>操作指南
  body: '<!i><gray>左侧导航可切换常用页面。

    绿色表示当前选择或主要操作。


    商店支持调整份数和查看总价。

    设置中的开关立即保存。

    表单填写完成后，点击保存或返回。


    语言默认跟随客户端，也可单独选择。'
  links: <!i>继续浏览
  original: <!i>切换到原界面
purchase:
  product-info: '<!i><gray>每份 <white>{product.amount}</white> 个

    单价 <green>{product.price}</green> {product.currency}

    份数 <white>{product.minimum}–{product.maximum}</white>

    步长 <white>{product.step}</white>'
profile:
  status: <!i>当前状态
services:
  balance: <!i><gray>当前金币  <green>%futureui_value_wallet%
search:
  filters: <!i>名称与排序
  value: <!i>{shop.search}
  empty: <!i><gray>点击输入商品名称
  category: <!i>商品分类（可多选，再次点击取消）
  clear: <!i>清空条件
  results: <!i>查看商品
  help: '<!i><gray>输入商品名称，保存后返回筛选页面。

    留空可查看已选分类的全部商品；未选分类时搜索所有商品。'
