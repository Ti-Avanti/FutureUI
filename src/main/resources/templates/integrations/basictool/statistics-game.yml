id: game
type: column
gap: 9
children:
- id: emblem
  type: image
  image: '{item.icon}'
  size: 36
  width: 54
  height: 54
  skin: readout
  align: center
- id: game_name
  type: text
  text: <!i><white>{item.plain-label}
  height: 18
  text-align: center
- id: game_status
  type: text
  text: <!i><#bbbbbb>{item.plain-detail}
  height: 27
  skin: readout
  padding: 9
- id: game_open
  type: button
  text: '@integrations.basictool.view-records'
  height: 27
  actions:
  - type: basictool:statistics
    operation: click
    control: '{item.control}'
    click: '{item.primary-click}'
  enabled:
    type: equals
    input: '{item.enabled}'
    output: 'true'
skin: panel
padding: 9
