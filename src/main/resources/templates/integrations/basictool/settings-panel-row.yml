# 六项设置行共 216 像素；切换和恢复入口保持固定位置。
id: panel_setting_row
type: row
gap: 9
children:
- id: setting_copy
  type: column
  gap: 0
  children:
  - id: setting_name
    type: text
    text: <!i><white>{item.plain-label}
    height: 18
  - id: setting_help
    type: text
    text: <!i><#bbbbbb>{item.plain-detail}
    height: 18
    states:
    - visible:
        type: equals
        input: '{item.inherited}'
        output: 'true'
      text: <!i><#8BC9C1>{item.value}
    - visible: true
  width: 180
- id: setting_controls
  type: column
  gap: 0
  children:
  - id: switch_control
    type: row
    gap: 0
    children:
    - id: switch_state
      type: text
      text: '@integrations.basictool.off'
      height: 27
      width: 45
      vertical-align: center
      states:
      - visible:
          type: equals
          input: '{item.on}'
          output: 'true'
        text: '@integrations.basictool.on'
      - visible: true
    - id: slider
      type: row
      gap: 0
      children:
      - id: switch_left
        type: text
        text: I
        height: 27
        width: 27
        skin: switch-on
        text-align: center
        vertical-align: center
        states:
        - visible:
            type: equals
            input: '{item.on}'
            output: 'true'
          type: text
          skin: switch-on
        - visible: true
          type: button
          skin: switch-thumb
          text: ''
          enabled:
            type: equals
            input: '{item.toggle-enabled}'
            output: 'true'
          actions:
          - type: basictool:settings
            operation: click
            control: '{item.control}'
            click: toggle
      - id: switch_right
        type: text
        text: O
        height: 27
        width: 27
        skin: readout
        text-align: center
        vertical-align: center
        states:
        - visible:
            type: equals
            input: '{item.on}'
            output: 'true'
          type: button
          skin: switch-thumb
          text: ''
          enabled:
            type: equals
            input: '{item.toggle-enabled}'
            output: 'true'
          actions:
          - type: basictool:settings
            operation: click
            control: '{item.control}'
            click: toggle
        - visible: true
          type: text
          skin: readout
      width: 54
    width: 99
    visible:
      type: equals
      input: '{item.switch}'
      output: 'true'
    align: end
  - id: small_choices
    type: list
    source: basictool:settings
    view: choices
    cache: false
    paginate: false
    item:
      id: choice
      type: button
      text: '{item.plain-label}'
      height: 27
      actions:
      - type: basictool:settings
        operation: choose
        control: '{item.control}'
        choice-control: '{item.choice-control}'
      enabled:
        type: equals
        input: '{item.enabled}'
        output: 'true'
      states:
      - visible:
          type: equals
          input: '{item.selected}'
          output: 'true'
        skin: selected
      - visible: true
        skin: button
    control: '{item.control}'
    layout:
      type: row
      gap: 0
    width: 180
    visible:
      type: equals
      input: '{item.inline}'
      output: 'true'
  - id: value
    type: button
    text: '{item.value} >'
    height: 27
    actions:
    - type: basictool:settings
      operation: click
      control: '{item.control}'
      click: '{item.primary-click}'
    width: 180
    skin: button
    enabled:
      type: equals
      input: '{item.enabled}'
      output: 'true'
    visible:
      type: all
      conditions:
      - type: equals
        input: '{item.switch}'
        output: 'false'
      - type: equals
        input: '{item.inline}'
        output: 'false'
    states:
    - visible:
        type: all
        conditions:
        - type: equals
          input: '{item.switch}'
          output: 'false'
        - type: equals
          input: '{item.inline}'
          output: 'false'
        - type: equals
          input: '{item.action_only}'
          output: 'true'
      text: '@integrations.basictool.open-setting'
    - visible:
        type: all
        conditions:
        - type: equals
          input: '{item.switch}'
          output: 'false'
        - type: equals
          input: '{item.inline}'
          output: 'false'
    align: end
  width: 180
- id: reset_slot
  type: column
  width: 27
  height: 27
  gap: 0
  children:
  - id: reset
    type: button
    text: '@integrations.basictool-panel.reset-short'
    height: 27
    actions:
    - type: basictool:settings
      operation: click
      control: '{item.control}'
      click: '{item.reset-click}'
    width: 27
    enabled:
      type: equals
      input: '{item.enabled}'
      output: 'true'
    visible:
      type: equals
      input: '{item.right}'
      output: 'true'
    states:
    - visible:
        type: all
        conditions:
        - type: equals
          input: '{item.right}'
          output: 'true'
        - type: equals
          input: '{item.global}'
          output: 'true'
      text: '@integrations.basictool-panel.reset-short'
    - visible:
        type: equals
        input: '{item.right}'
        output: 'true'
      text: '@integrations.basictool-panel.reset-short'
padding: 0
skin: readout
# 互斥控件在静态校验时共同计高；实际行高由可见控件决定，至少为 36。
min-height: 36
