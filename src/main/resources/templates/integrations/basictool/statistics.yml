renderer: canvas
permission: basictool.stats
layout:
  type: column
  width: 666
  padding: 0
  gap: 9
  theme: adventure
  exit-button: false
refresh-ticks: 0
on-open:
- type: basictool:statistics
  operation: opened
on-close:
- type: basictool:statistics
  operation: closed
components:
- id: page
  type: list
  source: basictool:statistics
  view: page
  cache: false
  paginate: false
  item:
    id: application
    type: column
    gap: 9
    children:
    - id: topbar
      type: row
      gap: 18
      children:
      - id: tab_left_space
        type: spacer
        width: 144
        height: 27
      - id: top_module_tabs
        template: integrations/basictool/module-tabs
        width: 504
    - id: workspace
      type: row
      gap: 18
      children:
      - id: sidebar
        type: column
        gap: 0
        children:
        - id: home
          type: button
          text: '@integrations.basictool.statistics-home'
          height: 27
          actions:
          - type: basictool:statistics
            operation: home
            control: '{item.control}'
            click: '{item.primary-click}'
          states:
          - visible:
              type: equals
              input: '{item.home}'
              output: 'true'
            skin: selected
          - visible: true
            skin: button
          text-align: start
          padding: 9
        - id: nav_top_gap
          type: spacer
          height: 9
        - id: nav_items
          type: column
          gap: 0
          children:
          - id: navigation
            type: list
            source: basictool:statistics
            view: navigation
            cache: false
            paginate: true
            item:
              id: nav
              type: button
              text: '{item.plain-label}'
              height: 27
              actions:
              - type: basictool:statistics
                operation: navigate
                control: '{item.control}'
                click: '{item.primary-click}'
              text-align: start
              padding: 9
              enabled:
                type: equals
                input: '{item.enabled}'
                output: 'true'
              states:
              - visible:
                  type: equals
                  input: '{item.selected}'
                  output: 'true'
                skin: selected
              - visible: true
                skin: button
            icons:
              general: book
              chat: paper
              appearance: name_tag
              broadcast: gold_ingot
              sound: experience_bottle
              privacy: glass
              requests: golden_apple
              frost: iron_sword
              quick: emerald
              b: iron_sword
              s: diamond
              f: iron_axe
              battle-royale-room-ticket: paper
              playerpoints-summer-80: emerald
            page-size: 7
            layout:
              type: column
              gap: 0
            visible:
              type: equals
              input: '{item.has-navigation}'
              output: 'true'
          height: 189
        - id: nav_bottom_gap
          type: spacer
          height: 9
        - id: nav_switcher
          type: column
          gap: 0
          children:
          - id: nav_pages
            type: row
            gap: 9
            children:
            - id: nav_prev
              type: button
              text: <
              height: 27
              actions:
              - type: page
                offset: -1
              text-align: start
              padding: 9
            - id: nav_next
              type: button
              text: '>'
              height: 27
              actions:
              - type: page
                offset: 1
              text-align: start
              padding: 9
            visible:
              type: equals
              input: '{item.navigation-paged}'
              output: 'true'
          height: 27
        - id: nav_close_gap
          type: spacer
          height: 63
        - id: close
          type: button
          text: '@integrations.basictool.close'
          height: 27
          actions:
          - type: close
          text-align: start
          padding: 9
        width: 144
        height: 351
      - id: body
        type: column
        gap: 9
        children:
        - id: heading
          type: row
          gap: 18
          children:
          - id: header_icon
            type: image
            image: golden_helmet
            size: 36
            width: 54
            height: 54
            skin: readout
          - id: heading_text
            type: column
            gap: 9
            children:
            - id: heading_title
              type: text
              text: '@integrations.basictool.section-statistics'
              height: 18
              states:
              - visible:
                  type: equals
                  input: '{item.menu}'
                  output: details
                text: <!i><bold>{item.mode-label}
              - visible:
                  type: equals
                  input: '{item.menu}'
                  output: modes
                text: <!i><bold>{item.season-label}
              - visible:
                  type: equals
                  input: '{item.source-id}'
                  output: fotiabattleroyale
                text: '@integrations.basictool.game-fotiabattleroyale'
              - visible:
                  type: equals
                  input: '{item.source-id}'
                  output: snowbyte
                text: '@integrations.basictool.game-snowbyte'
              - visible:
                  type: equals
                  input: '{item.source-id}'
                  output: frostmodern
                text: '@integrations.basictool.game-frostmodern'
              - visible: true
            - id: identity
              type: row
              gap: 9
              children:
              - id: query_subject
                type: text
                text: <!i>{item.subject}
                height: 27
                skin: readout
                padding: 9
                visible:
                  type: all
                  conditions:
                  - type: equals
                    input: '{item.group}'
                    output: statistics
                  - type: equals
                    input: '{item.self}'
                    output: 'false'
              - id: scope
                type: text
                text: '{item.scope}'
                height: 27
                skin: readout
                visible:
                  type: all
                  conditions:
                  - type: equals
                    input: '{item.has-scope}'
                    output: 'true'
                  - type: not
                    condition:
                      type: equals
                      input: '{item.menu}'
                      output: overview
                text-align: start
                vertical-align: center
                padding: 9
              - id: page_number
                type: text
                text: '{item.page} / {item.pages}'
                height: 27
                width: 63
                skin: readout
                text-align: center
                vertical-align: center
                visible:
                  type: not
                  condition:
                    type: equals
                    input: '{item.pages}'
                    output: '1'
              height: 27
          visible:
            type: not
            condition: &id001
              type: any
              conditions:
              - type: equals
                input: '{item.menu}'
                output: modes
              - type: equals
                input: '{item.menu}'
                output: details
        - id: record_heading
          type: row
          gap: 9
          height: 27
          visible: *id001
          children:
          - id: record_context
            type: text
            text: '@integrations.basictool.rank-context'
            height: 27
            vertical-align: center
            states:
            - visible:
                type: equals
                input: '{item.menu}'
                output: modes
              text: '@integrations.basictool.rank-season-context'
            - visible: true
          - id: other_player
            type: text
            text: <!i>{item.subject}
            height: 27
            width: 117
            skin: readout
            padding: 9
            visible:
              type: equals
              input: '{item.self}'
              output: 'false'
          - id: record_page
            type: text
            text: '{item.page} / {item.pages}'
            height: 27
            width: 63
            skin: readout
            text-align: center
            vertical-align: center
            visible:
              type: not
              condition:
                type: equals
                input: '{item.pages}'
                output: '1'
        - id: games
          type: list
          source: basictool:statistics
          view: entries
          cache: false
          paginate: false
          item:
            id: game
            template: integrations/basictool/statistics-game
          icons:
            general: book
            chat: paper
            appearance: name_tag
            broadcast: gold_ingot
            sound: experience_bottle
            privacy: glass
            requests: golden_apple
            frost: iron_sword
            quick: emerald
            b: iron_sword
            s: diamond
            f: iron_axe
            battle-royale-room-ticket: paper
            playerpoints-summer-80: emerald
          layout:
            type: grid
            columns: 3
            gap: 9
          visible:
            type: equals
            input: '{item.menu}'
            output: overview
        - id: rank
          template: integrations/basictool/rank-card
          visible:
            type: equals
            input: '{item.home}'
            output: 'false'
        - id: win_summary
          type: row
          padding: 9
          gap: 9
          skin: well
          height: 45
          visible:
            type: all
            conditions:
            - type: equals
              input: '{item.menu}'
              output: details
            - type: equals
              input: '{item.has-outcomes}'
              output: 'true'
          children:
          - id: win_rate_label
            type: text
            text: '@integrations.basictool.rank-win-rate'
            height: 27
            width: 63
            vertical-align: center
          - id: win_track
            type: column
            gap: 0
            children:
            - id: win_space
              type: spacer
              height: 9
            - id: win_bar
              type: progress
              height: 9
              value: '{item.stat.win-rate-fraction}'
              track-skin: readout
              fill-skin: chart-main
          - id: win_rate_value
            type: text
            text: '{item.stat.win-rate}%'
            height: 27
            width: 63
            skin: readout
            text-align: center
            vertical-align: center
        - id: history
          type: list
          source: basictool:statistics
          view: entries
          cache: false
          paginate: false
          item:
            id: record
            template: integrations/basictool/statistics-record
          icons:
            general: book
            chat: paper
            appearance: name_tag
            broadcast: gold_ingot
            sound: experience_bottle
            privacy: glass
            requests: golden_apple
            frost: iron_sword
            quick: emerald
            b: iron_sword
            s: diamond
            f: iron_axe
            battle-royale-room-ticket: paper
            playerpoints-summer-80: emerald
          layout:
            type: column
            gap: 9
          visible:
            type: all
            conditions:
            - type: any
              conditions:
              - type: equals
                input: '{item.source}'
                output: seasons
              - type: equals
                input: '{item.source}'
                output: records
            - type: equals
              input: '{item.empty}'
              output: 'false'
        - id: fields
          type: list
          source: basictool:statistics
          view: entries
          cache: false
          paginate: false
          item:
            id: field
            template: integrations/basictool/statistics-field
          layout:
            type: grid
            columns: 2
            gap: 9
          visible:
            type: all
            conditions:
            - type: equals
              input: '{item.menu}'
              output: details
            - type: equals
              input: '{item.status}'
              output: ready
        - id: controls
          type: list
          source: basictool:statistics
          view: controls
          cache: false
          paginate: false
          item:
            id: control
            type: button
            text: '{item.plain-label}'
            height: 27
            actions:
            - type: basictool:statistics
              operation: click
              control: '{item.control}'
              click: '{item.primary-click}'
            enabled:
              type: equals
              input: '{item.enabled}'
              output: 'true'
            states:
            - visible:
                type: equals
                input: '{item.action-kind}'
                output: previous
              text: '@integrations.basictool.previous'
            - visible:
                type: equals
                input: '{item.action-kind}'
                output: next
              text: '@integrations.basictool.next'
            - visible:
                type: equals
                input: '{item.action-kind}'
                output: back
              text: '@integrations.basictool.back'
            - visible:
                type: equals
                input: '{item.action-kind}'
                output: scope
              text: '@integrations.basictool.edit-scope'
            - visible:
                type: equals
                input: '{item.action-kind}'
                output: reset-category
              text: '@integrations.basictool.restore-category'
            - visible:
                type: all
                conditions:
                - type: equals
                  input: '{item.action-kind}'
                  output: reset-value
                - type: equals
                  input: '{item.global}'
                  output: 'true'
              text: '@integrations.basictool.restore-default'
            - visible:
                type: equals
                input: '{item.action-kind}'
                output: reset-value
              text: '@integrations.basictool.use-common'
            - visible: true
          layout:
            type: grid
            columns: 3
            gap: 9
          visible:
            type: equals
            input: '{item.has-controls}'
            output: 'true'
        width: 504
        padding: 9
        skin: panel
        min-height: 351
  icons:
    general: book
    chat: paper
    appearance: name_tag
    broadcast: gold_ingot
    sound: experience_bottle
    privacy: glass
    requests: golden_apple
    frost: iron_sword
    quick: emerald
    b: iron_sword
    s: diamond
    f: iron_axe
    battle-royale-room-ticket: paper
    playerpoints-summer-80: emerald
  rank:
    icon: golden_helmet
    ranked-categories:
    - ranked
    score-fields:
    - points
    - rating
    - elo
    fields:
      name: rank
      id: rank_id
      base-id: base_rank_id
      category: category
      minimum: minimum_points
      next: next_points
      progress: progress
      position: position
    tiers:
    - prefix: bronze
      icon: bricks
      name-token: '{lang:ranked.rank.bronze}'
      translation: bronze
    - prefix: silver
      icon: iron_ingot
      name-token: '{lang:ranked.rank.silver}'
      translation: silver
    - prefix: gold
      icon: gold_ingot
      name-token: '{lang:ranked.rank.gold}'
      translation: gold
    - prefix: platinum
      icon: emerald
      name-token: '{lang:ranked.rank.platinum}'
      translation: platinum
    - prefix: diamond
      icon: diamond
      name-token: '{lang:ranked.rank.diamond}'
      translation: diamond
    - prefix: master
      icon: iron_sword
      name-token: '{lang:ranked.rank.master}'
      translation: master
    - prefix: king
      icon: golden_helmet
      name-token: '{lang:ranked.rank.king}'
      translation: king
    - prefix: glorious-king
      icon: golden_apple
      name-token: '{lang:ranked.rank.glorious-king}'
      translation: glorious-king
    - prefix: supreme-king
      icon: experience_bottle
      name-token: '{lang:ranked.rank.supreme-king}'
      translation: supreme-king
