            quick: emerald
            b: iron_sword
            s: diamond
            f: iron_axe
            battle-royale-room-ticket: paper
            playerpoints-summer-80: emerald
            locale: emerald
            display.players: name_tag
            display.tab: name_tag
            display.nametags: name_tag
            chat.receive: book
            chat.public: book
            chat.private: paper
            chat.party: book
            chat.mention: gold_ingot
            chat.channel: book
            chat.color: book
            chat.background: book
            shout.player: book
            shout.system: book
            announcement.honor: book
            announcement.recruitment: emerald
            announcement.regular: book
            announcement.chatgame: book
            announcement.combat: iron_sword
            notification.sound: experience_bottle
            menu.sound: book
            privacy.presence: emerald
            nick.active: book
            nick.reveal-friends: name_tag
            privacy.statistics: book
            privacy.api: book
            manage.social-blocks: glass
            manage.chat-blocks: gold_ingot
            request.friend: book
            request.party: book
            request.duel: book
            request.teleport: emerald
            notification.friends: gold_ingot
            frost.spectators: glass
            frost.ping-scoreboard: book
            frost.multi-platform: book
            frost.ping-range: book
            frost.time: book
            frost.effect: book
            frost.clear-inventory: book
            frost.start-flying: paper
            frost.kit-editor: book
            quiet: book
          inline-choices: true
          layout:
            type: column
            gap: 9
          visible:
            type: equals
            input: '{item.menu}'
            output: category
        - id: choices
          type: list
          source: basictool:settings
          view: entries
          cache: false
          paginate: false
          item:
            id: choice
            template: integrations/basictool/setting-card
          icons:
            general: book
            chat: paper
            appearance: name_tag
            broadcast: gold_ingot
            sound: experience_bottle
            privacy: glass
            requests: golden_apple
            frost: iron_sword
            quick: emerald
            b: iron_sword
            s: diamond
            f: iron_axe
            battle-royale-room-ticket: paper
            playerpoints-summer-80: emerald
            locale: emerald
            display.players: name_tag
            display.tab: name_tag
            display.nametags: name_tag
            chat.receive: book
            chat.public: book
            chat.private: paper
            chat.party: book
            chat.mention: gold_ingot
            chat.channel: book
            chat.color: book
            chat.background: book
            shout.player: book
            shout.system: book
            announcement.honor: book
            announcement.recruitment: emerald
            announcement.regular: book
            announcement.chatgame: book
            announcement.combat: iron_sword
            notification.sound: experience_bottle
            menu.sound: book
            privacy.presence: emerald
            nick.active: book
            nick.reveal-friends: name_tag
            privacy.statistics: book
            privacy.api: book
            manage.social-blocks: glass
            manage.chat-blocks: gold_ingot
            request.friend: book
            request.party: book
            request.duel: book
            request.teleport: emerald
            notification.friends: gold_ingot
            frost.spectators: glass
            frost.ping-scoreboard: book
            frost.multi-platform: book
            frost.ping-range: book
            frost.time: book
            frost.effect: book
            frost.clear-inventory: book
            frost.start-flying: paper
            frost.kit-editor: book
            quiet: book
          layout:
            type: grid
            columns: 2
            gap: 9
          visible:
            type: any
            conditions:
            - type: equals
              input: '{item.menu}'
              output: values
            - type: equals
              input: '{item.menu}'
              output: scopes
        - id: reset_confirmation
          type: column
          gap: 18
          children:
          - id: reset_intro
            type: row
            gap: 9
            children:
            - id: reset_copy
              type: column
              gap: 0
              children:
              - id: reset_title
                type: text
                text: '@integrations.basictool.restore-title'
                height: 18
              - id: reset_help
                type: text
                text: '@integrations.basictool.restore-help'
                height: 36
              - id: reset_scope
                type: text
                text: <!i><white>{item.category-label} · {item.scope-label}
                height: 18
          - id: reset_actions
            type: list
            source: basictool:settings
            view: entries
            cache: false
            paginate: false
            item:
              id: reset_action
              type: button
              text: '{item.plain-label}'
              height: 27
              actions:
              - type: basictool:settings
                operation: click
                control: '{item.control}'
                click: '{item.primary-click}'
              enabled:
                type: equals
                input: '{item.enabled}'
                output: 'true'
              states:
              - visible:
                  type: equals
                  input: '{item.symbol}'
                  output: y
                skin: selected
              - visible: true
            layout:
              type: grid
              columns: 2
              gap: 9
            icons:
              locale: emerald
              display.players: name_tag
              display.tab: name_tag
              display.nametags: name_tag
              chat.receive: book
              chat.public: book
              chat.private: paper
              chat.party: book
              chat.mention: gold_ingot
              chat.channel: book
              chat.color: book
              chat.background: book
              shout.player: book
              shout.system: book
              announcement.honor: book
              announcement.recruitment: emerald
              announcement.regular: book
              announcement.chatgame: book
              announcement.combat: iron_sword
              notification.sound: experience_bottle
              menu.sound: book
              privacy.presence: emerald
              nick.active: book
              nick.reveal-friends: name_tag
              privacy.statistics: book
              privacy.api: book
              manage.social-blocks: glass
              manage.chat-blocks: gold_ingot
              request.friend: book
              request.party: book
              request.duel: book
              request.teleport: emerald
              notification.friends: gold_ingot
              frost.spectators: glass
