              frost.clear-inventory: book
              frost.start-flying: paper
              frost.kit-editor: book
              quiet: book
          visible:
            type: equals
            input: '{item.menu}'
            output: reset
        - id: empty
          type: text
          text: '@integrations.basictool.empty'
          height: 54
          skin: readout
          padding: 9
          visible:
            type: all
            conditions:
            - type: equals
              input: '{item.empty}'
              output: 'true'
            - type: equals
              input: '{item.menu}'
              output: category
          vertical-align: center
        - id: category_footer
          type: column
          gap: 9
          children:
          - id: category_options
            type: list
            source: basictool:settings
            view: controls
            cache: false
            paginate: false
            item:
              id: filtered_control
              type: column
              gap: 0
              visible:
                type: any
                conditions:
                - type: equals
                  input: '{item.action-kind}'
                  output: scope
                - type: equals
                  input: '{item.action-kind}'
                  output: reset-category
              children:
              - id: control
                type: button
                text: '{item.plain-label}'
                height: 27
                actions:
                - type: basictool:settings
                  operation: click
                  control: '{item.control}'
                  click: '{item.primary-click}'
                enabled:
                  type: equals
                  input: '{item.enabled}'
                  output: 'true'
                states:
                - visible:
                    type: equals
                    input: '{item.action-kind}'
                    output: previous
                  text: '@integrations.basictool.previous'
                - visible:
                    type: equals
                    input: '{item.action-kind}'
                    output: next
                  text: '@integrations.basictool.next'
                - visible:
                    type: equals
                    input: '{item.action-kind}'
                    output: back
                  text: '@integrations.basictool.back-category'
                - visible:
                    type: equals
                    input: '{item.action-kind}'
                    output: scope
                  text: '@integrations.basictool.edit-scope'
                - visible:
                    type: equals
                    input: '{item.action-kind}'
                    output: reset-category
                  text: '@integrations.basictool.restore-category'
                - visible:
                    type: all
                    conditions:
                    - type: equals
                      input: '{item.action-kind}'
                      output: reset-value
                    - type: equals
                      input: '{item.global}'
                      output: 'true'
                  text: '@integrations.basictool.restore-default'
                - visible:
                    type: equals
                    input: '{item.action-kind}'
                    output: reset-value
                  text: '@integrations.basictool.use-common'
                - visible: true
            layout:
              type: grid
              columns: 2
              gap: 9
            visible:
              type: equals
              input: '{item.has-controls}'
              output: 'true'
            after-items:
            - id: test_notification_sound
              template: integrations/basictool/setting-preview
          - id: category_pager
            type: list
            source: basictool:settings
            view: controls
            cache: false
            paginate: false
            item:
              id: filtered_control
              type: column
              gap: 0
              visible:
                type: any
                conditions:
                - type: equals
                  input: '{item.action-kind}'
                  output: previous
                - type: equals
                  input: '{item.action-kind}'
                  output: next
              children:
              - id: control
                type: button
                text: '{item.plain-label}'
                height: 27
                actions:
                - type: basictool:settings
                  operation: click
                  control: '{item.control}'
                  click: '{item.primary-click}'
                enabled:
                  type: equals
                  input: '{item.enabled}'
                  output: 'true'
                states:
                - visible:
                    type: equals
                    input: '{item.action-kind}'
                    output: previous
                  text: '@integrations.basictool.previous'
                - visible:
                    type: equals
                    input: '{item.action-kind}'
                    output: next
                  text: '@integrations.basictool.next'
                - visible:
                    type: equals
                    input: '{item.action-kind}'
                    output: back
                  text: '@integrations.basictool.back-category'
                - visible:
                    type: equals
                    input: '{item.action-kind}'
                    output: scope
                  text: '@integrations.basictool.edit-scope'
                - visible:
                    type: equals
                    input: '{item.action-kind}'
                    output: reset-category
                  text: '@integrations.basictool.restore-category'
                - visible:
                    type: all
                    conditions:
                    - type: equals
                      input: '{item.action-kind}'
                      output: reset-value
                    - type: equals
                      input: '{item.global}'
                      output: 'true'
                  text: '@integrations.basictool.restore-default'
                - visible:
                    type: equals
                    input: '{item.action-kind}'
                    output: reset-value
                  text: '@integrations.basictool.use-common'
                - visible: true
            layout:
              type: grid
              columns: 2
              gap: 9
            visible:
              type: all
              conditions:
              - type: equals
                input: '{item.has-controls}'
                output: 'true'
              - type: not
                condition:
                  type: equals
                  input: '{item.pages}'
                  output: '1'
          visible:
            type: equals
            input: '{item.menu}'
            output: category
        - id: controls
          type: list
          source: basictool:settings
          view: controls
          cache: false
          paginate: false
          item:
            id: control
            type: button
            text: '{item.plain-label}'
            height: 27
            actions:
            - type: basictool:settings
              operation: click
              control: '{item.control}'
              click: '{item.primary-click}'
            enabled:
              type: equals
              input: '{item.enabled}'
              output: 'true'
            states:
            - visible:
                type: equals
                input: '{item.action-kind}'
                output: previous
              text: '@integrations.basictool.previous'
            - visible:
                type: equals
                input: '{item.action-kind}'
                output: next
              text: '@integrations.basictool.next'
            - visible:
                type: equals
                input: '{item.action-kind}'
                output: back
              text: '@integrations.basictool.back-category'
            - visible:
                type: equals
                input: '{item.action-kind}'
                output: scope
              text: '@integrations.basictool.edit-scope'
            - visible:
                type: equals
                input: '{item.action-kind}'
                output: reset-category
              text: '@integrations.basictool.restore-category'
            - visible:
                type: all
                conditions:
                - type: equals
                  input: '{item.action-kind}'
                  output: reset-value
                - type: equals
                  input: '{item.global}'
                  output: 'true'
              text: '@integrations.basictool.restore-default'
            - visible:
                type: equals
                input: '{item.action-kind}'
                output: reset-value
              text: '@integrations.basictool.use-common'
            - visible: true
          layout:
            type: grid
            columns: 3
            gap: 9
          visible:
            type: all
            conditions:
            - type: equals
              input: '{item.has-controls}'
              output: 'true'
            - type: not
              condition:
                type: equals
                input: '{item.menu}'
                output: category
        width: 504
        padding: 9
        skin: panel
        min-height: 351
  icons:
    general: book
    chat: paper
    appearance: name_tag
    broadcast: gold_ingot
    sound: experience_bottle
    privacy: glass
    requests: golden_apple
    frost: iron_sword
    quick: emerald
    b: iron_sword
    s: diamond
    f: iron_axe
    battle-royale-room-ticket: paper
