# 第二套紧凑像素界面；独立配置。
id: compact/online
title: '@menus.online.title'
renderer: canvas
layout:
  type: column
  width: 540
  padding: 9
  gap: 9
  theme: compact
  exit-button: true
  exit-width: 126
components:
- id: heading
  type: text
  skin: readout
  padding: 9
  text: '@menus.online.heading'
  height: 27
- id: players
  type: list
  source: online-players
  cache: false
  page-size: 6
  layout:
    type: grid
    columns: 2
    gap: 9
    min-height: 243
  item:
    id: player
    type: column
    skin: readout
    padding: 9
    gap: 9
    children:
    - id: player_name
      type: text
      text: '@menus.online.player'
    - id: world
      type: text
      text: '@menus.online.world'
    - id: inspect
      type: button
      text: '@menus.online.inspect'
      actions:
      - type: open-menu
        menu: compact/profile
        arguments:
          target.uuid: '{item.uuid}'
      height: 27
  detail-menu: compact/profile
- id: footer
  type: row
  gap: 9
  children:
  - id: back
    type: button
    text: '@common.back'
    actions:
    - type: back
    width: 108
    height: 27
  - id: previous
    type: button
    text: '@common.previous'
    actions:
    - type: page
      offset: -1
    width: 108
    height: 27
  - id: page
    type: text
    skin: readout
    text: '{page} / {pages}'
    height: 27
    vertical-align: center
    text-align: center
  - id: next
    type: button
    text: '@common.next'
    actions:
    - type: page
      offset: 1
    width: 108
    height: 27
refresh-ticks: 100
