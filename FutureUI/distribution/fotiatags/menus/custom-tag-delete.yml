# 玩家菜单显示引擎：inventory / futureui；未安装 FutureUI 时保留原菜单。
ui-engine: futureui

# 自定义称号删除确认菜单

title: "<red><!i>删除自定义称号"
size: 27

# P = 删除信息
# Y = 确认删除
# N = 取消
# X = 装饰
layout:
  - "XXXXXXXXX"
  - "XXYXPXNXX"
  - "XXXXXXXXX"

items:
  X:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    lore: []

  P:
    material: NAME_TAG
    name: "<red><!i>确认删除 %tag_name%"
    lore:
      - "<gray>ID: %tag_id%"
      - "<gray>展示: %tag_full%"
      - "<gray>删除后会从称号仓库移除"
      - "<gray>退款金额: %refund_amount%"
    actions: []

  Y:
    material: LIME_CONCRETE
    name: "<green><!i>确认删除"
    lore:
      - "<yellow>点击后立即删除"
    actions:
      - "confirm-delete"

  N:
    material: RED_CONCRETE
    name: "<red><!i>取消"
    lore:
      - "<gray>返回自定义称号详情"
    actions:
      - "cancel-delete"
