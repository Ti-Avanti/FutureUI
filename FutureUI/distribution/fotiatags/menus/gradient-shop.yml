# 玩家菜单显示引擎：inventory / futureui；未安装 FutureUI 时保留原菜单。
ui-engine: futureui

# 动态效果购买菜单；true 表示不显示玩家已拥有的效果
hide-owned: true
title: "<!i><gradient:#55FFFF:#FFD700>动态效果商店</gradient> <gray>(%page%/%total_pages%)"
size: 54

layout:
  - "XXXXXXXXX"
  - "X       X"
  - "X       X"
  - "X       X"
  - "X       X"
  - "PXXXBXXXN"

effect-slots:
  - 10
  - 11
  - 12
  - 13
  - 14
  - 15
  - 16
  - 19
  - 20
  - 21
  - 22
  - 23
  - 24
  - 25
  - 28
  - 29
  - 30
  - 31
  - 32
  - 33
  - 34
  - 37
  - 38
  - 39
  - 40
  - 41
  - 42
  - 43

items:
  X:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  P:
    material: ARROW
    name: "<yellow><!i>上一页"
    lore:
      - "<gray>当前: %page%/%total_pages%"
    action: prev-page
  N:
    material: ARROW
    name: "<yellow><!i>下一页"
    lore:
      - "<gray>当前: %page%/%total_pages%"
    action: next-page
  B:
    material: CHEST
    name: "<yellow><!i>返回效果仓库"
    lore:
      - "<gray>当前使用: %selected_effect%"
      - ""
      - "<yellow>点击返回"
    action: back

effect-item:
  selected:
    material: NAME_TAG
    use-effect-icon: true
    name: "<green><!i>%effect_name% <gray>(已拥有)"
    lore:
      - "<gray>预览: %effect_preview%"
    glow: true
  unselected:
    material: NAME_TAG
    use-effect-icon: true
    name: "<white><!i>%effect_name%"
    lore:
      - "<gray>ID: %effect_id%"
      - "<gray>预览: %effect_preview%"
      - "<gray>购买时长: %duration%"
      - "<gray>支付方式: %provider%"
      - "<gray>价格: %price%"
      - ""
      - "<yellow>点击购买"
    glow: false
