# 玩家菜单显示引擎：inventory / futureui；未安装 FutureUI 时保留原菜单。
ui-engine: futureui

# 称号选择菜单配置

# 菜单标题（支持MiniMessage格式）
title: "<gradient:#FFD700:#FFA500><!i>称号选择</gradient>"

# 菜单大小（必须是9的倍数，最大54）
size: 54

# 菜单布局
# 每个字符代表一个槽位
# 空格表示空槽位
# 其他字符在items中定义
layout:
  - "XXXXXXXXX"
  - "X       X"
  - "X       X"
  - "X       X"
  - "X       X"
  - "XXXXCXXXX"

# 物品定义
items:
  # 边框物品
  X:
    material: BLACK_STAINED_GLASS_PANE
    name: " "

  # 清除称号按钮
  C:
    material: BARRIER
    name: "<red><!i>清除称号"
    lore:
      - ""
      - "<gray>点击清除当前称号"
    actions:
      - "sound: UI_BUTTON_CLICK-1-1"
      - "clear-tag"

# 称号物品模板
tag-item:
  # 已选择的称号
  selected:
    material: PLAYER_HEAD
    name: "<green><!i>%tag_name% <gray>(已选择)"
    lore:
      - ""
      - "<gray>前缀: %tag_prefix%"
      - "<gray>后缀: %tag_suffix%"
      - ""
      - "<yellow>点击取消选择"
    glow: true

  # 未选择的称号
  unselected:
    material: PLAYER_HEAD
    name: "<white><!i>%tag_name%"
    lore:
      - ""
      - "<gray>前缀: %tag_prefix%"
      - "<gray>后缀: %tag_suffix%"
      - "<gray>过期时间: %tag_expire%"
      - ""
      - "<yellow>点击选择此称号"
    glow: false

# 称号显示位置（槽位编号）
tag-slots:
  - 10
  - 11
  - 12
  - 13
  - 14
  - 15
  - 16
  - 19
  - 20
  - 21
  - 22
  - 23
  - 24
  - 25
  - 28
  - 29
  - 30
  - 31
  - 32
  - 33
  - 34

# 翻页按钮配置
pagination:
  # 上一页按钮槽位
  prev-page-slot: 45
  # 下一页按钮槽位
  next-page-slot: 53

  # 上一页按钮（有上一页时显示）
  prev-page:
    material: ARROW
    name: "<yellow><!i>上一页"
    lore:
      - ""
      - "<gray>点击返回上一页"

  # 上一页按钮（没有上一页时显示）
  prev-page-disabled:
    material: GRAY_STAINED_GLASS_PANE
    name: "<gray><!i>没有上一页"
    lore: []

  # 下一页按钮（有下一页时显示）
  next-page:
    material: ARROW
    name: "<yellow><!i>下一页"
    lore:
      - ""
      - "<gray>点击前往下一页"

  # 下一页按钮（没有下一页时显示）
  next-page-disabled:
    material: GRAY_STAINED_GLASS_PANE
    name: "<gray><!i>没有下一页"
    lore: []
