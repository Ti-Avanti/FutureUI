  locked: <red>No posees ese cosmético.
  hidden: <yellow>Este tipo de cosmético está oculto en el servidor o mundo actual.
  storage-error: <red>Error al guardar; el cambio fue revertido.
  expired: <yellow>El cosmético temporal <white>{cosmetic}</white> expiró y se retiró.
