    disabled: <!i><dark_gray>No hay página anterior
  next:
    enabled: <!i><yellow>Página siguiente
    disabled: <!i><dark_gray>No hay página siguiente
  unequip:
    enabled: <!i><red>Quitar cosmético actual
    disabled: <!i><dark_gray>Nada equipado
  back: <!i><yellow>Volver a cosméticos
  close: <!i><red>Cerrar
