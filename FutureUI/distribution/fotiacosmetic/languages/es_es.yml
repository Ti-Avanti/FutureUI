# 所有菜单文本支持 MiniMessage 和旧颜色码；请保留占位符。
prefix: '<gray>[<gold>FotiaCosmetic</gold>]</gray> '
general:
  not-ready: <red>El sistema de cosméticos todavía se está iniciando. Inténtalo de nuevo en breve.
  no-permission: <red>No tienes permiso para hacer eso.
  player-only: <red>Este comando solo puede usarlo un jugador.
  player-not-found: <red>No se encontró al jugador <white>{player}</white>.
  cosmetic-not-found: <red>No se encontró el cosmético <white>{cosmetic}</white>.
  invalid-target: '<red>Ranura o tipo de arma no válido: <white>{target}</white>.'
  cosmetic-target-mismatch: <red><white>{cosmetic}</white> pertenece a <white>{actual}</white>, no a <white>{expected}</white>.
  invalid-duration: <red>Duración no válida <white>{duration}</white>. Usa permanent, 1h, 1d12h, 7d o una fecha
    ISO-8601.
  operation-failed: '<red>La operación falló: <white>{reason}</white>.'
  reload-success: <green>Configuración, idiomas, catálogo y menú recargados.
  reload-failed: <red>Error al recargar. Revisa la ruta exacta en la consola.
command:
  management-help: <yellow>/fc</yellow> abre el menú; concede con <yellow>/fc grant [jugador|*] [slot|weapon] [ranura|tipo-de-arma]
    [ID] [permanent|1h|1d]</yellow>; revoke/equip usan el mismo destino y unequip omite el ID.
  grant-success: <green>Se otorgó <white>{cosmetic}</white> a <white>{player}</white>.
  grant-limited-success: <green>Se otorgó <white>{cosmetic}</white> a <white>{player}</white> durante <white>{duration}</white>.
  grant-all-success: '<green>Se otorgó <white>{cosmetic}</white> a todos los jugadores conocidos: {total} en total,
    {updated} actualizados, {unchanged} sin cambios, {failed} fallidos.'
  grant-all-limited-success: '<green>Se otorgó <white>{cosmetic}</white> a todos los jugadores conocidos durante
    {duration}: {total} en total, {updated} actualizados, {unchanged} sin cambios, {failed} fallidos.'
  revoke-success: <green>Se retiró <white>{cosmetic}</white> a <white>{player}</white>.
  equip-success: <green>Se seleccionó <white>{cosmetic}</white> para <white>{player}</white>.
  unequip-success: <green>Se retiró el cosmético <white>{target}</white> de <white>{player}</white>.
  already-owned: <yellow>El jugador ya posee ese cosmético.
  not-owned: <red>El jugador no posee ese cosmético.
  not-selected: <yellow>No hay ningún cosmético seleccionado para ese objetivo.
  cancelled: <yellow>Otro plugin canceló la operación.
  info: <gray>Posee <white>{owned}</white> cosméticos (<white>{limited}</white> temporales), equipa <white>{equipped}</white>
    ranuras y selecciona <white>{weapons}</white> aspectos de arma.
profile:
  load-failed: <red>No se pudo cargar tu perfil de cosméticos. Vuelve a conectarte o contacta a un administrador.
gui:
  back-failed: <!i><red>No se pudo abrir el menú anterior. Contacta con un administrador.
  layout-usage: '<!i><yellow>Tamaño del menú: /fc layout compact o /fc layout standard.'
  layout-unavailable: <!i><yellow>El administrador no ha activado FutureUI para este menú.
  title: <!i><dark_gray>Cosméticos Fotia <gray>Página {page}/{pages}
  weapon-title: <!i><dark_gray>Aspectos de armas <gray>Página {page}/{pages}
  loading: <red>Tu perfil todavía se está cargando.
  preview-unavailable: <!i>Vista previa no disponible; la selección se aplica a armas nuevas en el servidor de juego.
  legendary-locked: <!i>No se puede cambiar el aspecto legendario durante esta partida.
  legendary-usage: '<!i>Uso: /fc legendary [ID del arma]'
  legendary-selected: <!i>Guardado {cosmetic}; las armas nuevas de este tipo usarán este aspecto.
  legendary-reset: <!i>Se restauró la selección predeterminada de esta arma.
category:
  head: <!i><gold>Sombreros
  chest: <!i><gold>Pecho
  legs: <!i><gold>Piernas
  feet: <!i><gold>Pies
  back: <!i><gold>Espalda
  off_hand: <!i><gold>Mano secundaria
  balloon: <!i><gold>Globos
  weapons: <!i><gold>Aspectos de arma
