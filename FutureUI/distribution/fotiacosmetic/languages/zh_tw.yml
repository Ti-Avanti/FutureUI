# 所有菜单文本支持 MiniMessage 和旧颜色码；请保留占位符。
prefix: '<gray>[<gold>FotiaCosmetic</gold>]</gray> '
general:
  not-ready: <red>時裝系統仍在初始化，請稍後再試。
  no-permission: <red>你沒有權限執行此操作。
  player-only: <red>該指令只能由玩家執行。
  player-not-found: <red>找不到玩家 <white>{player}</white>。
  cosmetic-not-found: <red>找不到時裝 <white>{cosmetic}</white>。
  invalid-target: <red>無效部位或武器類型：<white>{target}</white>。
  cosmetic-target-mismatch: <red><white>{cosmetic}</white> 實際屬於 <white>{actual}</white>，不能按 <white>{expected}</white>
    操作。
  invalid-duration: <red>無效期限 <white>{duration}</white>；可用格式：永久、1h、1d12h、7d 或 ISO-8601 時間。
  operation-failed: <red>操作失敗：<white>{reason}</white>。
  reload-success: <green>設定、語言、目錄與選單已重新載入。
  reload-failed: <red>重新載入失敗，請查看控制台中的精確設定路徑。
command:
  management-help: <yellow>/fc</yellow> 開啟選單；給予：<yellow>/fc grant [玩家|*] [slot|weapon] [部位|武器類型] [ID] [永久|1h|1d]</yellow>；revoke/equip
    使用相同分類參數，unequip 不填寫 ID。
  grant-success: <green>已給予 <white>{player}</white> 時裝 <white>{cosmetic}</white>。
  grant-limited-success: <green>已給予 <white>{player}</white> 限時時裝 <white>{cosmetic}</white>，期限 <white>{duration}</white>。
  grant-all-success: <green>已向全部已知玩家給予 <white>{cosmetic}</white>：共 {total}，更新 {updated}，未變 {unchanged}，失敗 {failed}。
  grant-all-limited-success: <green>已向全部已知玩家給予限時時裝 <white>{cosmetic}</white>（{duration}）：共 {total}，更新 {updated}，未變
    {unchanged}，失敗 {failed}。
  revoke-success: <green>已收回 <white>{player}</white> 的時裝 <white>{cosmetic}</white>。
  equip-success: <green>已為 <white>{player}</white> 選擇 <white>{cosmetic}</white>。
  unequip-success: <green>已清除 <white>{player}</white> 的 <white>{target}</white> 時裝。
  already-owned: <yellow>玩家已經擁有該時裝。
  not-owned: <red>玩家尚未擁有該時裝。
  not-selected: <yellow>該部位目前沒有選擇時裝。
  cancelled: <yellow>操作已被其他外掛取消。
  info: <gray>擁有 <white>{owned}</white> 件（其中限時 <white>{limited}</white> 件），穿戴 <white>{equipped}</white> 個普通部位，選擇
    <white>{weapons}</white> 種武器皮膚。
profile:
  load-failed: <red>無法載入你的時裝資料，請重新連線或聯絡管理員。
gui:
  back-failed: <!i><red>無法開啟返回選單，請聯絡管理員。
  layout-usage: <!i><yellow>選單尺寸：/fc layout compact（緊湊）或 /fc layout standard（標準）。
  layout-unavailable: <!i><yellow>管理員尚未為此選單啟用 FutureUI 顯示。
  title: <!i><dark_gray>Fotia 時裝 <gray>第 {page}/{pages} 頁
  weapon-title: <!i><dark_gray>武器皮膚 <gray>第 {page}/{pages} 頁
  loading: <red>資料仍在載入。
  preview-unavailable: <!i>暫無模型預覽；可預選，在遊戲服生成武器時生效。
  legendary-locked: <!i>目前對局不允許更換傳奇武器外觀。
  legendary-usage: <!i>用法：/fc legendary [武器ID]
  legendary-selected: <!i>已儲存外觀 {cosmetic}，之後新生成的該武器將使用此外觀。
  legendary-reset: <!i>已恢復該武器的預設外觀預選。
category:
  head: <!i><gold>帽子
  chest: <!i><gold>胸甲
  legs: <!i><gold>褲子
  feet: <!i><gold>鞋子
  back: <!i><gold>背飾
  off_hand: <!i><gold>副手
  balloon: <!i><gold>氣球
  weapons: <!i><gold>武器皮膚
weapon:
  sword: 劍
  bow: 弓
  axe: 斧
  pickaxe: 鎬
  crossbow: 弩
  mace: 重錘
  spear: 矛
  trident: 三叉戟
  shield: 盾
weapon-tab:
  name: <!i><aqua>{weapon}
cosmetic:
  available:
    name: <!i><green>{name}
    action: <!i><gray>點擊選擇
  equipped:
    name: <!i><gold>{name}
    action: <!i><yellow>目前已選擇
  locked:
    name: <!i><red>{name}
    action: <!i><gray>你尚未擁有該時裝
  hidden:
    name: <!i><dark_gray>{name}
    action: <!i><gray>目前伺服器或世界不顯示該類型
control:
  weapon-previous:
    enabled: <!i><yellow>上一組武器類型
    disabled: <!i><dark_gray>沒有上一組武器類型
  weapon-next:
    enabled: <!i><yellow>下一組武器類型
    disabled: <!i><dark_gray>沒有下一組武器類型
  previous:
    enabled: <!i><yellow>上一頁
    disabled: <!i><dark_gray>沒有上一頁
  next:
    enabled: <!i><yellow>下一頁
    disabled: <!i><dark_gray>沒有下一頁
  unequip:
    enabled: <!i><red>脫下目前時裝
    disabled: <!i><dark_gray>目前沒有時裝
  back: <!i><yellow>返回時裝選單
  close: <!i><red>關閉
feedback:
  equipped: <green>已選擇時裝 <white>{cosmetic}</white>。
  unequipped: <green>已脫下 <white>{target}</white> 的時裝。
  locked: <red>你尚未擁有該時裝。
  hidden: <yellow>目前伺服器或世界隱藏了這種時裝。
  storage-error: <red>儲存失敗，本次變更已撤銷。
  expired: <yellow>限時時裝 <white>{cosmetic}</white> 已到期並自動卸下。
navigation:
  back: <!i><yellow>返回上一層選單
  main: <!i><gold>時裝
  weapons: <!i><gold>武器
  legendary: <!i><gold>傳奇武器
  category-previous: <!i><gold>上一頁分類
  category-next: <!i><gold>下一頁分類
  reset: <!i><gold>恢復預設外觀
  default-selected: <!i><gold>目前為預設外觀
legendary:
  lava_sword: <!i><gold>熔岩劍
  chainsaw: <!i><gold>電鋸刀
  emerald_sword: <!i><gold>綠寶石大劍
  dragon_sword: <!i><gold>終界龍劍
  armadillo_cannon: <!i><gold>犰狳大炮
  toxic_crossbow: <!i><gold>劇毒弩
  puffer_cannon: <!i><gold>河豚炮
  sonic_crossbow: <!i><gold>音波弩
  guardian_cannon: <!i><gold>守衛者大炮
  bee_gun: <!i><gold>蜜蜂槍
  poseidon_trident: <!i><gold>海神波塞頓三叉戟

skin-ownership:
  owned: "<!i><green>已擁有"
  unowned: "<!i><red>未擁有"
  selected: "<!i><gold>已擁有 · 使用中"
  open: "<!i><yellow>點擊查看皮膚"
  collection: "<!i><gray>已擁有 {owned}/{total} 款皮膚"
