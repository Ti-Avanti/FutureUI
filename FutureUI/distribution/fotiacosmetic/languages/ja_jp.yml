  available:
    name: <!i><green>{name}
    action: <!i><gray>クリックして選択
  equipped:
    name: <!i><gold>{name}
    action: <!i><yellow>選択中
  locked:
    name: <!i><red>{name}
    action: <!i><gray>このコスメを所有していません
  hidden:
    name: <!i><dark_gray>{name}
    action: <!i><gray>このサーバーまたはワールドでは非表示です
control:
  weapon-previous:
    enabled: <!i><yellow>前の武器タイプ
    disabled: <!i><dark_gray>前の武器タイプなし
  weapon-next:
    enabled: <!i><yellow>次の武器タイプ
    disabled: <!i><dark_gray>次の武器タイプなし
  previous:
    enabled: <!i><yellow>前のページ
    disabled: <!i><dark_gray>前のページなし
  next:
    enabled: <!i><yellow>次のページ
    disabled: <!i><dark_gray>次のページなし
  unequip:
    enabled: <!i><red>現在のコスメを外す
    disabled: <!i><dark_gray>装備なし
  back: <!i><yellow>コスメメニューに戻る
  close: <!i><red>閉じる
feedback:
  equipped: <green>コスメ <white>{cosmetic}</white> を選択しました。
  unequipped: <green><white>{target}</white> のコスメを外しました。
  locked: <red>そのコスメを所有していません。
  hidden: <yellow>現在のサーバーまたはワールドではこのタイプは非表示です。
  storage-error: <red>保存に失敗したため、変更を元に戻しました。
  expired: <yellow>期限付きコスメ <white>{cosmetic}</white> の期限が切れ、自動的に解除されました。
navigation:
  back: <!i><yellow>前のメニューに戻る
  main: <!i><gold>コスメ
  weapons: <!i><gold>武器
  legendary: <!i><gold>伝説の武器
  category-previous: <!i><gold>前のカテゴリ
  category-next: <!i><gold>次のカテゴリ
  reset: <!i><gold>標準の外観に戻す
  default-selected: <!i><gold>標準の外観を選択中
legendary:
  lava_sword: <!i><gold>溶岩の剣
