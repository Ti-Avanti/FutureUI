  emerald_sword: <!i><gold>エメラルドの大剣
  dragon_sword: <!i><gold>エンダードラゴンの剣
  armadillo_cannon: <!i><gold>アルマジロ砲
  toxic_crossbow: <!i><gold>猛毒のクロスボウ
