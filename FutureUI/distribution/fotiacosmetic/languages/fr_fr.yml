# 所有菜单文本支持 MiniMessage 和旧颜色码；请保留占位符。
prefix: '<gray>[<gold>FotiaCosmetic</gold>]</gray> '
general:
  not-ready: <red>Le système cosmétique est encore en cours d'initialisation. Réessayez bientôt.
  no-permission: <red>Vous n'avez pas la permission d'effectuer cette action.
  player-only: <red>Cette commande est réservée aux joueurs.
  player-not-found: <red>Le joueur <white>{player}</white> est introuvable.
  cosmetic-not-found: <red>Le cosmétique <white>{cosmetic}</white> est introuvable.
  invalid-target: '<red>Emplacement ou type d''arme invalide : <white>{target}</white>.'
  cosmetic-target-mismatch: <red><white>{cosmetic}</white> appartient à <white>{actual}</white>, pas à <white>{expected}</white>.
  invalid-duration: <red>Durée invalide <white>{duration}</white>. Utilisez permanent, 1h, 1d12h, 7d ou un instant
    ISO-8601.
  operation-failed: '<red>Échec de l''opération : <white>{reason}</white>.'
  reload-success: <green>Configuration, langues, catalogue et menu rechargés.
  reload-failed: <red>Échec du rechargement. Consultez le chemin exact dans la console.
command:
  management-help: '<yellow>/fc</yellow> ouvre le menu ; attribution : <yellow>/fc grant [joueur|*] [slot|weapon]
    [emplacement|type-d''arme] [ID] [permanent|1h|1d]</yellow> ; revoke/equip utilisent la même cible et unequip
    omet l''ID.'
  grant-success: <green><white>{cosmetic}</white> a été accordé à <white>{player}</white>.
  grant-limited-success: <green><white>{cosmetic}</white> a été accordé à <white>{player}</white> pour <white>{duration}</white>.
  grant-all-success: '<green><white>{cosmetic}</white> a été accordé à tous les joueurs connus : {total} au total,
    {updated} mis à jour, {unchanged} inchangés, {failed} échecs.'
  grant-all-limited-success: '<green><white>{cosmetic}</white> a été accordé à tous les joueurs connus pour {duration}
    : {total} au total, {updated} mis à jour, {unchanged} inchangés, {failed} échecs.'
  revoke-success: <green><white>{cosmetic}</white> a été retiré à <white>{player}</white>.
  equip-success: <green><white>{cosmetic}</white> a été sélectionné pour <white>{player}</white>.
  unequip-success: <green>Le cosmétique <white>{target}</white> de <white>{player}</white> a été retiré.
  already-owned: <yellow>Le joueur possède déjà ce cosmétique.
  not-owned: <red>Le joueur ne possède pas ce cosmétique.
  not-selected: <yellow>Aucun cosmétique n'est sélectionné pour cette cible.
  cancelled: <yellow>Un autre plugin a annulé l'opération.
  info: <gray>Possède <white>{owned}</white> cosmétiques (<white>{limited}</white> temporaires), équipe <white>{equipped}</white>
    emplacements et sélectionne <white>{weapons}</white> skins d'arme.
profile:
  load-failed: <red>Votre profil cosmétique n'a pas pu être chargé. Reconnectez-vous ou contactez un administrateur.
gui:
  back-failed: <!i><red>Impossible d’ouvrir le menu précédent. Contactez un administrateur.
  layout-usage: '<!i><yellow>Taille du menu : /fc layout compact ou /fc layout standard.'
  layout-unavailable: <!i><yellow>FutureUI n’est pas activé pour ce menu par l’administrateur.
  title: <!i><dark_gray>Cosmétiques Fotia <gray>Page {page}/{pages}
  weapon-title: <!i><dark_gray>Apparences d'armes <gray>Page {page}/{pages}
  loading: <red>Votre profil est encore en cours de chargement.
  preview-unavailable: <!i>Aperçu indisponible ; la sélection s’applique aux nouvelles armes sur le serveur de jeu.
  legendary-locked: <!i>Impossible de changer l’apparence légendaire pendant cette partie.
  legendary-usage: '<!i>Utilisation : /fc legendary [ID de l’arme]'
  legendary-selected: <!i>{cosmetic} enregistré ; les nouvelles armes de ce type utiliseront cette apparence.
  legendary-reset: <!i>Sélection par défaut rétablie pour cette arme.
