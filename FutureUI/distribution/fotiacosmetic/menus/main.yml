# FutureUI 0.0.3beta 发布包接管配置，需搭配支持统一衣柜的 FotiaCosmetic 1.0.2 或后续兼容版本。
# 本示例启用 FutureUI；可改为 inventory 使用原箱子菜单。按需合并，不覆盖已有自定义菜单。
# 统一菜单：第一行每类连续占三格，第二行分类独立翻页，第三至五行共 27 个皮肤位置。
# layout 每行 9 字符；同一按钮字符可重复出现，点击对应格子执行相同动作。
# roles.empty 对应留空位置；roles.filler 对应装饰格。返回按钮默认位于第六行第二格。
# ui-engine 默认 inventory；futureui 统一用于三个一级分类，尺寸偏好按玩家保存。
# 分类按钮的 selected/unselected 分别配置选中和未选中外观，支持 material（或 id）、item-model、custom-model-data、name、lore、glow。
# material/id 为原版材质；item-model 必须为命名空间键，如 fotia:menu/selected，客户端需安装对应资源包。
title-key: gui.title
# 普通时装是否展示未拥有的皮肤；false 时没有已拥有皮肤就留空，不显示屏障。
# 仅影响“时装”分类，传奇武器始终显示全部皮肤及拥有状态。
show-unowned: false
layout:
- MMMWWWGGG
- LCCCCCCCR
- SSSSSSSSS
- SSSSSSSSS
- SSSSSSSSS
- PB..U...N
roles:
  category: C
  weapon-menu: W
  cosmetic: S
  previous: P
  unequip: U
  close: X
  back: B
  next: N
  filler: '#'
  empty: '.'
  main-menu: M
  legendary-menu: G
  category-previous: L
  category-next: R
categories:
  head:
    target: slot:head
    selected:
      id: DIAMOND_HELMET
      glow: true
      name-key: category.head
    unselected:
      id: IRON_HELMET
      name-key: category.head
  chest:
    target: slot:chest
    selected:
      id: DIAMOND_CHESTPLATE
      glow: true
      name-key: category.chest
    unselected:
      id: IRON_CHESTPLATE
      name-key: category.chest
  legs:
    target: slot:legs
    selected:
      id: DIAMOND_LEGGINGS
      glow: true
      name-key: category.legs
    unselected:
      id: IRON_LEGGINGS
      name-key: category.legs
  feet:
    target: slot:feet
    selected:
      id: DIAMOND_BOOTS
      glow: true
      name-key: category.feet
    unselected:
      id: IRON_BOOTS
      name-key: category.feet
  back:
    target: slot:back
    selected:
      id: CHEST
      glow: true
      name-key: category.back
    unselected:
      id: BARREL
      name-key: category.back
  off_hand:
    target: slot:off_hand
    selected:
      id: TOTEM_OF_UNDYING
      glow: true
      name-key: category.off_hand
    unselected:
      id: TORCH
      name-key: category.off_hand
  balloon:
    target: slot:balloon
    selected:
      id: LEAD
      glow: true
      name-key: category.balloon
    unselected:
      id: LEAD
      name-key: category.balloon
weapon-menu:
  selected:
    material: NETHERITE_SWORD
    glow: true
    name-key: navigation.weapons
  unselected:
    material: NETHERITE_SWORD
    glow: false
    name-key: navigation.weapons
cosmetic-states:
  available:
    name-key: cosmetic.available.name
    lore-keys:
    - cosmetic.available.action
  equipped:
    glow: true
    name-key: cosmetic.equipped.name
    lore-keys:
    - cosmetic.equipped.action
  locked:
    replace-icon: true
    id: BARRIER
    name-key: cosmetic.locked.name
    lore-keys:
    - cosmetic.locked.action
  hidden:
    replace-icon: true
    id: STRUCTURE_VOID
    name-key: cosmetic.hidden.name
    lore-keys:
    - cosmetic.hidden.action
controls:
  previous:
    # 无可翻页内容时隐藏按钮；false 则显示 disabled 物品。
    hide-when-disabled: true
    enabled:
      id: ARROW
      name-key: control.previous.enabled
    disabled:
      id: GRAY_DYE
      name-key: control.previous.disabled
  unequip:
    enabled:
      id: RED_DYE
      name-key: control.unequip.enabled
    disabled:
      id: LIGHT_GRAY_DYE
      name-key: control.unequip.disabled
  close:
    item:
      id: BARRIER
      name-key: control.close
  back:
    item:
      id: ARROW
      name-key: navigation.back
    action:
      # CLOSE 关闭菜单；PLAYER_COMMAND 由玩家执行命令；CONSOLE_COMMAND 由控制台执行命令。
      type: CLOSE
      # 填写目标插件实际存在的打开菜单命令，支持 {player}；不需要开头的 /。
      # 命令模式必须填写此项；未指定目标时使用上面的 CLOSE，不会猜测其他插件的菜单入口。
      command: ""
  next:
    hide-when-disabled: true
    enabled:
      id: ARROW
      name-key: control.next.enabled
    disabled:
      id: GRAY_DYE
      name-key: control.next.disabled
  category-previous:
    hide-when-disabled: true
    enabled:
      id: ARROW
      name-key: navigation.category-previous
    disabled:
      id: GRAY_DYE
      name-key: control.previous.disabled
  category-next:
    hide-when-disabled: true
    enabled:
      id: ARROW
      name-key: navigation.category-next
    disabled:
      id: GRAY_DYE
      name-key: control.next.disabled
  reset:
    enabled:
      id: RED_DYE
      name-key: navigation.reset
    disabled:
      id: GRAY_DYE
      name-key: navigation.default-selected
filler:
  item:
    id: BLACK_STAINED_GLASS_PANE
    name: <!i>
ui-engine: futureui
futureui:
  menu: fotiacosmetic/wardrobe
  page-size: 4
  category-page-size: 5
  default-layout: compact
  compact:
    menu: fotiacosmetic/wardrobe_compact
    page-size: 2
    category-page-size: 2
menu-version: 3
main-menu:
  selected:
    material: CHEST
    glow: true
    name-key: navigation.main
  unselected:
    material: CHEST
    glow: false
    name-key: navigation.main
legendary-menu:
  selected:
    material: NETHER_STAR
    glow: true
    name-key: navigation.legendary
  unselected:
    material: NETHER_STAR
    glow: false
    name-key: navigation.legendary
