# 通用配置示例，可按服务器需求修改；不依赖专属菜单代码。
id: "batch-feedback"
parameters:
  sound: "minecraft:block.note_block.pling"
actions:
  -
    type: "sound"
    sound: "{arg.sound}"
    volume: 0.3
  -
    type: "calculate"
    key: "result"
    expression: "round({player.health}, 1)"
  -
    type: "return"
    value: "{result}"
