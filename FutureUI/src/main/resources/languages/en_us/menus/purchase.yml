# FutureUI 语言资源；修改后可重载，参数名称在各语言中保持一致。
title: "<!i><gold>CONFIRM PURCHASE"
description: "<!i><white>{product.name}\n<gray>Items per bundle: <white>{product.amount}\n<gray>Price per bundle: <green>{product.price} <gray>({product.currency})"
balance: "<!i><gray>Your balance: <green>{product.balance}"
quantity: "<!i>Bundles"
confirm: "<!i><white>Confirm Purchase"
apply: "<!i>Apply quantity / update total"
ready: "<!i><green>Available"
totals: "<!i><white>{product.quantity} bundles <gray>· <white>{product.total-items} items\n<gray>Total <green>{product.total} {product.currency}\n<gray>Range {product.minimum}–{product.maximum} · Can buy {product.available-maximum} bundles\n{product.status}"
heading: "<!i><white><bold>REVIEW YOUR ORDER</bold>"
product-info: "<!i><white>{product.amount} <gray>items / bundle\n<gray>Price <green>{product.price} {product.currency}\n<gray>Range {product.minimum}–{product.maximum} · Step {product.step}"
maximum: "<!i>Buy up to {product.available-maximum} bundles"
item-count: "<!i><white>{product.quantity} <gray>bundles · <white>{product.total-items} <gray>items"
total-price: "<!i><gray>Total <green>{product.total} {product.currency}"
input-hint: "<!i><gray>Click the number to enter a quantity"
