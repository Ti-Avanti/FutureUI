# FutureUI 语言资源；修改后可重载，参数名称在各语言中保持一致。
title: "<!i><gold>购买确认"
description: "<!i><white>{product.name}\n<gray>每份数量：<white>{product.amount}\n<gray>每份价格：<green>{product.price} <gray>({product.currency})"
balance: "<!i><gray>当前余额：<green>{product.balance}"
quantity: "<!i>购买份数"
confirm: "<!i><white>确认购买"
apply: "<!i>应用数量 / 更新总价"
ready: "<!i><green>可购买"
totals: "<!i><white>{product.quantity} 份 <gray>· 实际 <white>{product.total-items} 个\n<gray>总价 <green>{product.total} {product.currency}\n<gray>份数范围 {product.minimum}–{product.maximum} · 当前最多可买 {product.available-maximum} 份\n{product.status}"
heading: "<!i><white><bold>确认你的选择</bold>"
product-info: "<!i><gray>每份 <white>{product.amount} <gray>个\n<gray>单价 <green>{product.price} {product.currency}\n<gray>份数范围 {product.minimum}–{product.maximum} · 步长 {product.step}"
maximum: "<!i>当前最多可买 {product.available-maximum} 份"
item-count: "<!i><white>{product.quantity} <gray>份 · 共 <white>{product.total-items} <gray>个"
total-price: "<!i><gray>合计 <green>{product.total} {product.currency}"
input-hint: "<!i><gray>点击数字框可直接输入份数"
