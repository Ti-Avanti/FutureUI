# 默认功能配置；布局、文本、条件与动作均可修改。
id: "profile"
title: "@menus.profile.title"
renderer: "canvas"
layout:
  type: "column"
  width: 540
  padding: 18
  gap: 9
components:
  - id: "heading"
    type: "text"
    text: "@menus.profile.heading"
    height: 27
  - id: "profile_panel"
    type: "column"
    skin: "surface"
    padding: 18
    gap: 9
    visible:
      type: "equals"
      input: "{profile.online}"
      output: "true"
    children:
      - id: "identity"
        type: "row"
        gap: 18
        children:
          - id: "portrait"
            type: "image"
            image: "iron_sword"
            size: 72
            width: 90
          - id: "facts"
            type: "column"
            skin: "readout"
            padding: 9
            gap: 9
            children:
              - id: "name"
                type: "text"
                text: "@menus.profile.name"
              - id: "world"
                type: "text"
                text: "@menus.profile.world"
              - id: "level"
                type: "text"
                text: "@menus.profile.level"
              - id: "ping"
                type: "text"
                text: "@menus.profile.ping"
      - id: "health"
        type: "text"
        skin: "readout"
        padding: 9
        text: "@menus.profile.health"
      - id: "health_progress"
        type: "progress"
        value: "{profile.health-fraction}"
        height: 9
      - id: "food"
        type: "text"
        skin: "readout"
        padding: 9
        text: "@menus.profile.food"
      - id: "food_progress"
        type: "progress"
        value: "{profile.food-fraction}"
        height: 9
      - id: "coordinates"
        type: "text"
        skin: "readout"
        padding: 9
        text: "@menus.profile.coordinates"
        height: 27
  - id: "offline"
    type: "text"
    text: "@menus.profile.offline"
    visible:
      type: "equals"
      input: "{profile.online}"
      output: "false"
    height: 27
  - id: "footer"
    type: "row"
    gap: 9
    children:
      - id: "back"
        type: "button"
        text: "@common.back"
        actions:
          - type: "back"
        width: 108
      - id: "copy_name"
        type: "button"
        text: "@menus.profile.copy"
        actions:
          - type: "copy-text"
            value: "{profile.name}"
            label: "@menus.profile.copy-link"
        enabled:
          type: "equals"
          input: "{profile.online}"
          output: "true"
      - id: "refresh"
        type: "button"
        text: "@common.refresh"
        actions:
          - type: "refresh"
        width: 108
refresh-ticks: 40
