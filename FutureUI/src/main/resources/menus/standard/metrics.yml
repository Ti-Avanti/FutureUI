# 默认功能配置；布局、文本、条件与动作均可修改。
id: "metrics"
title: "@menus.metrics.title"
renderer: "canvas"
layout:
  type: "column"
  width: 594
  padding: 18
  gap: 9
components:
  - id: "heading"
    type: "text"
    text: "@menus.metrics.heading"
    height: 27
  - id: "counts"
    type: "list"
    source: "metrics"
    cache: false
    page-size: 8
    layout:
      type: "column"
      gap: 0
      min-height: 216
    item:
      id: "count"
      type: "text"
      skin: "readout"
      padding: 9
      text: "@menus.metrics.row"
      height: 27
  - id: "footer"
    type: "row"
    gap: 9
    children:
      - id: "back"
        type: "button"
        text: "@common.back"
        actions:
          - type: "back"
        width: 108
      - id: "previous"
        type: "button"
        text: "@common.previous"
        actions:
          - type: "page"
            offset: -1
        width: 108
      - id: "page"
        type: "text"
        skin: "readout"
        text: "{page} / {pages}"
        height: 27
        text-align: "center"
        vertical-align: "center"
      - id: "next"
        type: "button"
        text: "@common.next"
        actions:
          - type: "page"
            offset: 1
        width: 108
permission: "futureui.admin"
refresh-ticks: 100
