# 第二套紧凑像素界面；独立配置。
template: compact/bedrock-page
id: compact/conditions
title: '@menus.conditions.title'
permission: futureui.admin
parameters:
- name: required
  type: integer
  default: 16
  min: 1
  max: 4096
bindings:
  condition.stone:
    type: item-count
    match:
      material: STONE
components:
- id: heading
  type: text
  text: '@menus.conditions.heading'
  height: 18
- id: workspace
  type: row
  gap: 9
  children:
  - id: overview
    type: column
    width: 198
    skin: surface
    padding: 9
    gap: 9
    children:
    - id: illustration
      type: image
      image: diamond
      size: 72
    - id: description
      type: text
      text: '@menus.conditions.description'
      height: 45
    - id: services
      type: button
      text: '@menus.services.title'
      height: 27
      actions:
      - type: open-menu
        menu: compact/services
  - id: content
    type: column
    gap: 9
    children:
    - id: balance
      type: text
      text: '@menus.conditions.balance'
      height: 54
      skin: readout
      padding: 9
    - id: count
      type: text
      text: '@menus.conditions.count'
      height: 54
      skin: readout
      padding: 9
    - id: checks
      type: row
      gap: 9
      children:
      - id: claim
        type: button
        text: '@menus.conditions.coupon'
        height: 27
        actions:
        - type: require
          requirements:
            type: requirements
            minimum: 2
            conditions:
            - id: access
              type: permission
              permission: futureui.use
            - id: materials
              type: has-item
              material: STONE
              amount: '{required}'
              optional: true
              on-failure:
              - type: message
                text: '@menus.conditions.materials-missing'
            - id: balance
              type: compare
              input: '%futureui_value_wallet%'
              operator: '>='
              output: 10
              optional: true
        - type: data-set
          key: benefits.shop-discount
          value: true
          ttl-seconds: 600
        - type: message
          text: '@menus.conditions.activated'
        skin: purchase
      - id: remove
        type: button
        text: '@menus.conditions.remove'
        height: 27
        actions:
        - type: data-remove
          key: benefits.shop-discount
        - type: message
          text: '@menus.conditions.removed'
    - id: diagnostics
      type: grid
      columns: 2
      gap: 9
      children:
      - id: trace
        type: button
        text: '@menus.conditions.trace'
        height: 27
        actions:
        - type: player-command
          command: fui trace %futureui_value_balance-label%
          parse:
            mode: raw
      - id: inspect
        type: button
        text: '@menus.conditions.inspect'
        height: 27
        actions:
        - type: player-command
          command: fui inspect conditions
      - id: validate
        type: button
        text: '@menus.conditions.validate'
        height: 27
        actions:
        - type: player-command
          command: fui validate
      - id: dryrun
        type: button
        text: '@menus.conditions.dryrun'
        height: 27
        actions:
        - type: player-command
          command: fui dryrun conditions claim
- id: footer
  type: row
  gap: 9
  children:
  - id: back
    type: button
    text: '@common.back'
    height: 27
    actions:
    - type: back
    width: 162
  - id: home
    type: button
    text: '@menus.services.home'
    height: 27
    actions:
    - type: open-menu
      menu: compact/main
layout:
  type: column
  width: 540
  padding: 9
  gap: 9
  theme: compact
  exit-button: true
  exit-width: 126
