# 第二套紧凑像素界面；独立配置。
id: compact/quantity
title: '@menus.quantity.title'
renderer: canvas
layout:
  type: column
  width: 540
  padding: 9
  gap: 9
  theme: compact
  exit-button: true
  exit-width: 126
components:
- id: heading
  type: text
  text: '@menus.quantity.heading'
  height: 18
- id: checkout
  type: row
  gap: 9
  children:
  - id: product_panel
    type: column
    width: 126
    padding: 9
    gap: 9
    skin: surface
    children:
    - id: product_name
      type: text
      text: '{product.name}'
      height: 9
      text-align: center
    - id: product_image
      type: image
      image: '{product.icon}'
      fallback-image: shop-emblem
      size: 72
    - id: product_numbers
      type: column
      skin: readout
      padding: 9
      gap: 0
      children:
      - id: product_info
        type: text
        text: '@menus.compact.purchase.product-info'
        height: 36
      - id: balance
        type: text
        text: '@menus.purchase.balance'
  - id: payment_panel
    type: column
    padding: 9
    gap: 9
    skin: surface
    children:
    - id: quantity_label
      type: text
      text: '@menus.purchase.quantity'
    - id: quantity_row
      type: row
      gap: 9
      children:
      - id: decrease
        type: button
        text: −
        height: 27
        actions:
        - type: adjust-number
          key: input.quantity
          initial: '{product.initial}'
          min: '{product.minimum}'
          max: '{product.maximum}'
          delta: '{product.decrement}'
          step: '{product.step}'
      - id: quantity
        type: button
        text: '{product.quantity}'
        skin: quantity
        height: 27
        tooltip: '@menus.shop.edit-quantity'
        actions:
        - type: open-menu
          menu: compact/quantity-input
      - id: increase
        type: button
        text: +
        height: 27
        actions:
        - type: adjust-number
          key: input.quantity
          initial: '{product.initial}'
          min: '{product.minimum}'
          max: '{product.maximum}'
          delta: '{product.step}'
          step: '{product.step}'
    - id: presets
      type: list
      source: variable-list
      key: product.presets
      cache: false
      paginate: false
      layout:
        type: grid
        columns: 3
        gap: 9
        min-height: 81
      item:
        id: preset
        type: button
        text: '{item.value}'
        height: 27
        states:
        - visible:
            type: equals
            input: '{input.quantity}'
            output: '{item.value}'
          skin: selected
        - visible:
            type: true
          skin: button
        actions:
        - type: set-variable
          key: input.quantity
          value: '{item.value}'
      after-items:
      - id: maximum
        type: button
        height: 27
        text: '@menus.quantity.maximum'
        enabled:
          type: equals
          input: '{product.any-available}'
          output: 'true'
        actions:
        - type: set-variable
          key: input.quantity
          value: '{product.available-maximum}'
    - id: totals
      type: column
      skin: readout
      padding: 9
      gap: 0
      children:
      - id: item_count
        type: text
        text: '@menus.purchase.item-count'
      - id: total_price
        type: text
        text: '@menus.purchase.total-price'
      - id: availability
        type: text
        text: '{product.status}'
        height: 18
    - id: apply
      type: button
      text: '@menus.quantity.apply'
      skin: purchase
      height: 27
      actions:
      - type: back
        values:
          '{product.quantity-key}': '{input.quantity}'
          input.quantity: '{input.quantity}'
- id: footer
  type: row
  gap: 9
  children:
  - id: back
    template: compact/back
    width: 108
  - id: help
    type: text
    text: '@menus.purchase.input-hint'
    height: 27
    vertical-align: center
