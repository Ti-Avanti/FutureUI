# 第二套紧凑像素界面；独立配置。
id: compact/main
title: '@menus.main.title'
renderer: canvas
layout:
  type: column
  width: 540
  padding: 0
  gap: 9
  theme: compact
  exit-button: true
  exit-width: 126
bindings:
  compact.section:
    value: main
  compact.balance:
    type: currency
    currency: vault
components:
- id: workspace
  type: row
  gap: 9
  children:
  - template: compact/navigation
  - id: content
    type: column
    gap: 9
    children:
    - id: overview
      type: column
      skin: panel
      padding: 9
      gap: 9
      children:
      - id: overview_title
        type: text
        text: '@menus.compact.home.heading'
        height: 9
      - id: identity
        type: row
        gap: 9
        children:
        - id: emblem
          type: image
          image: shop-emblem
          size: 72
          width: 81
        - id: identity_details
          type: column
          gap: 9
          children:
          - id: welcome
            type: text
            text: '@menus.compact.home.welcome'
            height: 18
          - id: coins
            type: text
            text: '@menus.compact.home.coins'
            height: 36
            skin: readout
            padding: 9
          - id: online
            type: text
            text: '@menus.compact.home.online'
            height: 27
            skin: readout
            padding: 9
    - id: quick
      type: column
      skin: panel
      padding: 9
      gap: 9
      children:
      - id: quick_title
        type: text
        text: '@menus.compact.home.quick'
        height: 9
      - id: quick_top
        type: row
        gap: 9
        children:
        - id: quick_shop
          type: button
          text: '@menus.main.shop'
          height: 27
          actions:
          - type: open-menu
            menu: compact/shop
            arguments:
              category: building
              shop.search: ''
          skin: selected
        - id: quick_wallet
          type: button
          text: '@menus.main.wallet'
          height: 27
          actions:
          - type: open-menu
            menu: compact/wallet
      - id: quick_bottom
        type: row
        gap: 9
        children:
        - id: quick_inventory
          type: button
          text: '@menus.main.inventory'
          height: 27
          actions:
          - type: open-menu
            menu: compact/inventory
        - id: quick_travel
          type: button
          text: '@menus.main.travel'
          height: 27
          actions:
          - type: open-menu
            menu: compact/travel
      - id: quick_help
        type: button
        height: 27
        text: '@menus.compact.help.title'
        actions:
        - type: open-menu
          menu: compact/help
open-commands:
- fui-compact
