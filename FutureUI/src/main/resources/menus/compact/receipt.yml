# 第二套紧凑像素界面；独立配置。
id: compact/receipt
title: '@menus.receipt.title'
renderer: canvas
layout:
  type: column
  width: 540
  padding: 9
  gap: 9
  theme: compact
  exit-button: true
  exit-width: 126
components:
- id: heading
  type: text
  text: '@menus.receipt.heading'
  height: 27
  vertical-align: center
- id: order
  type: row
  gap: 9
  children:
  - id: product_preview
    type: column
    width: 126
    skin: surface
    padding: 9
    gap: 9
    children:
    - id: product_image
      type: image
      image: '{product.icon}'
      fallback-image: shop-emblem
      size: 72
    - id: product_name
      type: text
      text: '{product.name}'
      height: 18
      text-align: center
  - id: order_details
    type: column
    vertical-align: center
    gap: 9
    children:
    - id: quantities
      type: row
      gap: 9
      children:
      - id: bundles
        type: column
        skin: readout
        padding: 9
        gap: 9
        children:
        - id: bundles_label
          type: text
          text: '@menus.receipt.bundles'
        - id: bundles_value
          type: text
          text: <!i><white><bold>{purchase.quantity}</bold>
          height: 18
      - id: items
        type: column
        skin: readout
        padding: 9
        gap: 9
        children:
        - id: items_label
          type: text
          text: '@menus.receipt.items'
        - id: items_value
          type: text
          text: <!i><white><bold>{purchase.items}</bold>
          height: 18
    - id: payment
      type: column
      skin: readout
      padding: 9
      gap: 9
      children:
      - id: paid_label
        type: text
        text: '@menus.receipt.paid'
      - id: paid_value
        type: text
        text: <!i><green><bold>{purchase.total}</bold> <gray>{product.currency}
        height: 18
    - id: remaining
      type: text
      skin: readout
      padding: 9
      text: '@menus.receipt.balance'
      height: 36
- id: actions
  type: row
  gap: 9
  children:
  - id: continue
    type: button
    skin: purchase
    height: 27
    text: '@menus.receipt.continue'
    actions:
    - type: open-menu
      menu: compact/shop
  - id: wallet
    type: button
    height: 27
    width: 162
    text: '@menus.receipt.wallet'
    actions:
    - type: open-menu
      menu: compact/wallet
