# 第二套紧凑像素界面；导航固定，右侧切换内容。
id: compact/services
title: '@menus.services.title'
renderer: canvas
layout:
  type: column
  width: 540
  padding: 0
  gap: 9
  theme: compact
  exit-button: true
  exit-width: 126
bindings:
  compact.section:
    value: services
components:
- id: workspace
  type: row
  gap: 9
  children:
  - template: compact/navigation
  - id: content
    type: column
    gap: 9
    children:
    - id: service_overview
      type: column
      gap: 9
      children:
      - id: service_title
        type: text
        text: '@menus.services.heading'
        height: 9
      - id: service_balance
        type: text
        text: '@menus.compact.services.balance'
        height: 27
        skin: readout
        padding: 9
      skin: panel
      padding: 9
    - id: service_panel
      type: column
      gap: 9
      children:
      - id: service_panel_title
        type: text
        text: '@menus.compact.home.quick'
        height: 9
      - id: service_actions
        type: grid
        columns: 2
        gap: 9
        children:
        - id: daily
          type: button
          text: '@menus.services.daily'
          height: 27
          actions:
          - type: open-menu
            menu: compact/daily
          skin: button
          text-align: center
          padding: 0
        - id: workshop
          type: button
          text: '@menus.inventory.title'
          height: 27
          actions:
          - type: open-menu
            menu: compact/inventory
          skin: button
          text-align: center
          padding: 0
        - id: cart
          type: button
          text: '@menus.services.cart'
          height: 27
          actions:
          - type: open-menu
            menu: compact/cart
          skin: button
          text-align: center
          padding: 0
        - id: recycle
          type: button
          text: '@menus.services.recycle'
          height: 27
          actions:
          - type: open-menu
            menu: compact/recycle
          skin: button
          text-align: center
          padding: 0
        - id: preferences
          type: button
          text: '@menus.services.preferences'
          height: 27
          actions:
          - type: open-menu
            menu: compact/preferences
          skin: button
          text-align: center
          padding: 0
        - id: capture
          type: button
          text: '@menus.services.capture'
          height: 27
          actions:
          - type: open-menu
            menu: compact/capture
          skin: button
          text-align: center
          padding: 0
        - id: automation
          type: button
          text: '@menus.services.automation'
          height: 27
          actions:
          - type: open-menu
            menu: compact/automation
          skin: button
          visible:
            type: permission
            permission: futureui.admin
          text-align: center
          padding: 0
        - id: conditions
          type: button
          text: '@menus.services.conditions'
          height: 27
          actions:
          - type: open-menu
            menu: compact/conditions
          skin: button
          text-align: center
          padding: 0
          visible:
            type: permission
            permission: futureui.admin
        - id: integrations
          type: button
          text: '@menus.services.integrations'
          height: 27
          actions:
          - type: open-menu
            menu: compact/integrations
          skin: button
          text-align: center
          padding: 0
          visible:
            type: permission
            permission: futureui.admin
        - id: shop
          type: button
          text: '@menus.main.shop'
          height: 27
          actions:
          - type: open-menu
            menu: compact/shop
          skin: button
          text-align: center
          padding: 0
      skin: panel
      padding: 9
      min-height: 207
