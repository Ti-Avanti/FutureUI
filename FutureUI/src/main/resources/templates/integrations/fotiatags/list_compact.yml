# FotiaTags 玩家界面：文字与底板共享网格，统一内边距及操作栏基线。
id: list_compact_list
type: column
gap: 0
children:
- id: list_compact_entries
  type: list
  source: fotiatags:menu
  view: entries
  cache: false
  paginate: false
  item:
    id: list_compact_entry
    template: integrations/fotiatags/entry_compact
  layout:
    type: grid
    columns: 1
    gap: 9
  visible:
    type: equals
    input: '{item.empty}'
    output: 'false'
- id: list_compact_empty
  type: text
  text: '@integrations.fotiatags.empty'
  height: 135
  vertical-align: center
  skin: panel
  text-align: center
  visible:
    type: equals
    input: '{item.empty}'
    output: 'true'
  padding: 9
min-height: 135
