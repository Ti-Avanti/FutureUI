renderer: canvas
permission: basictool.vouchers
layout:
  type: column
  width: 666
  padding: 0
  gap: 9
  theme: adventure
  exit-button: false
refresh-ticks: 0
on-open:
- type: basictool:vouchers
  operation: opened
on-close:
- type: basictool:vouchers
  operation: closed
components:
- id: page
  type: list
  source: basictool:vouchers
  view: page
  cache: false
  paginate: false
  item:
    id: application
    type: column
    gap: 9
    children:
    - id: topbar
      type: row
      gap: 18
      children:
      - id: tab_left_space
        type: spacer
        width: 144
        height: 27
      - id: top_module_tabs
        template: integrations/basictool/module-tabs
        width: 504
    - id: workspace
      type: row
      gap: 18
      children:
      - id: sidebar
        type: column
        gap: 0
        children:
        - id: vouchers_home
          type: button
          text: '@integrations.basictool.vouchers-home'
          height: 27
          actions:
          - type: basictool:vouchers
            operation: home
            control: '{item.control}'
            click: '{item.primary-click}'
          skin: selected
          text-align: start
          padding: 9
        - id: ticket_top_space
          type: spacer
          height: 18
        - id: collection_note
          type: text
          text: '@integrations.basictool.collection-note'
          height: 54
          padding: 9
        - id: ticket_bottom_space
          type: spacer
          height: 225
        - id: close
          type: button
          text: '@integrations.basictool.close'
          height: 27
          actions:
          - type: close
          text-align: start
          padding: 9
        width: 144
        height: 351
      - id: body
        type: column
        gap: 9
        children:
        - id: heading
          type: row
          gap: 18
          children:
          - id: header_icon
            type: image
            image: paper
            size: 36
            width: 54
            height: 54
            skin: readout
          - id: heading_text
            type: column
            gap: 9
            children:
            - id: heading_title
              type: text
              text: '@integrations.basictool.section-vouchers'
              height: 18
            - id: identity
              type: row
              gap: 9
              children:
              - id: query_subject
                type: text
                text: <!i>{item.subject}
                height: 27
                skin: readout
                padding: 9
                visible:
                  type: all
                  conditions:
                  - type: equals
                    input: '{item.group}'
                    output: statistics
                  - type: equals
                    input: '{item.self}'
                    output: 'false'
              - id: scope
                type: text
                text: '{item.scope}'
                height: 27
                skin: readout
                visible:
                  type: all
                  conditions:
                  - type: equals
                    input: '{item.has-scope}'
                    output: 'true'
                  - type: not
                    condition:
                      type: equals
                      input: '{item.menu}'
                      output: overview
                text-align: start
                vertical-align: center
                padding: 9
              - id: page_number
                type: text
                text: '{item.page} / {item.pages}'
                height: 27
                width: 63
                skin: readout
                text-align: center
                vertical-align: center
                visible:
                  type: not
                  condition:
                    type: equals
                    input: '{item.pages}'
                    output: '1'
              height: 27
        - id: tickets
          type: list
          source: basictool:vouchers
          view: entries
          cache: false
          paginate: false
          item:
            id: ticket
            template: integrations/basictool/voucher-ticket
          icons:
            general: book
            chat: paper
            appearance: name_tag
            broadcast: gold_ingot
            sound: experience_bottle
            privacy: glass
            requests: golden_apple
            frost: iron_sword
            quick: emerald
            b: iron_sword
            s: diamond
            f: iron_axe
            battle-royale-room-ticket: paper
            playerpoints-summer-80: paper
          layout:
            type: grid
            columns: 2
            gap: 9
          visible:
            type: equals
            input: '{item.empty}'
            output: 'false'
        - id: ticket_detail
          type: list
          source: basictool:vouchers
          view: detail
          cache: false
          paginate: false
          item:
            id: description
            type: column
            gap: 0
            children:
            - id: detail_heading
              type: text
              text: <!i><white>{item.plain-label}
              height: 18
            - id: detail_copy
              type: text
              text: '{item.description}'
              height: 54
            padding: 9
            skin: readout
          visible:
            type: equals
            input: '{item.empty}'
            output: 'false'
          icons:
            playerpoints-summer-80: paper
        - id: empty
          type: text
          text: '@integrations.basictool.ticket-empty'
          height: 126
          skin: readout
          padding: 9
          visible:
            type: equals
            input: '{item.empty}'
            output: 'true'
          states:
          - visible:
              type: all
              conditions:
              - type: equals
                input: '{item.empty}'
                output: 'true'
              - type: equals
                input: '{item.has-empty-label}'
                output: 'true'
            text: '{item.empty-label}

              {item.empty-description}'
          - visible:
              type: equals
              input: '{item.empty}'
              output: 'true'
        - id: controls
          type: list
          source: basictool:vouchers
          view: controls
          cache: false
          paginate: false
          item:
            id: control
            type: button
            text: '{item.plain-label}'
            height: 27
            actions:
            - type: basictool:vouchers
              operation: click
              control: '{item.control}'
              click: '{item.primary-click}'
            enabled:
              type: equals
              input: '{item.enabled}'
              output: 'true'
            states:
            - visible:
                type: equals
                input: '{item.action-kind}'
                output: previous
              text: '@integrations.basictool.previous'
            - visible:
                type: equals
                input: '{item.action-kind}'
                output: next
              text: '@integrations.basictool.next'
            - visible:
                type: equals
                input: '{item.action-kind}'
                output: back
              text: '@integrations.basictool.back'
            - visible:
                type: equals
                input: '{item.action-kind}'
                output: scope
              text: '@integrations.basictool.edit-scope'
            - visible:
                type: equals
                input: '{item.action-kind}'
                output: reset-category
              text: '@integrations.basictool.restore-category'
            - visible:
                type: all
                conditions:
                - type: equals
                  input: '{item.action-kind}'
                  output: reset-value
                - type: equals
                  input: '{item.global}'
                  output: 'true'
              text: '@integrations.basictool.restore-default'
            - visible:
                type: equals
                input: '{item.action-kind}'
                output: reset-value
              text: '@integrations.basictool.use-common'
            - visible: true
          layout:
            type: grid
            columns: 3
            gap: 9
          visible:
            type: equals
            input: '{item.has-controls}'
            output: 'true'
          icons:
            playerpoints-summer-80: paper
        width: 504
        padding: 9
        skin: panel
        min-height: 351
  icons:
    general: book
    chat: paper
    appearance: name_tag
    broadcast: gold_ingot
    sound: experience_bottle
    privacy: glass
    requests: golden_apple
    frost: iron_sword
    quick: emerald
    b: iron_sword
    s: diamond
    f: iron_axe
    battle-royale-room-ticket: paper
    playerpoints-summer-80: emerald
