renderer: canvas
permission: fotiacosmetic.use
layout:
  type: column
  width: 252
  gap: 9
  padding: 0
  theme: adventure
  exit-button: false
refresh-ticks: 0
defaults:
  wardrobe.yaw: -25
on-open:
- type: fotiacosmetic:menu
  operation: opened
on-close:
- type: fotiacosmetic:menu
  operation: closed
components:
- id: page
  type: list
  source: fotiacosmetic:menu
  view: page
  cache: false
  paginate: false
  item:
    id: wardrobe
    type: column
    gap: 9
    children:
    - id: sections
      type: row
      gap: 9
      height: 27
      children:
      - id: main_tab
        type: button
        text: '@integrations.fotiacosmetic-unified.appearance'
        height: 27
        actions:
        - type: fotiacosmetic:menu
          operation: view
          id: main
        states:
        - visible:
            type: equals
            input: '{item.section}'
            output: main
          skin: selected
        - visible: true
          skin: button
      - id: weapons_tab
        type: button
        text: '@integrations.fotiacosmetic-unified.weapons'
        height: 27
        actions:
        - type: fotiacosmetic:menu
          operation: view
          id: weapons
        states:
        - visible:
            type: equals
            input: '{item.section}'
            output: weapons
          skin: selected
        - visible: true
          skin: button
      - id: legendary_tab
        type: button
        text: '@integrations.fotiacosmetic-unified.legendary'
        height: 27
        actions:
        - type: fotiacosmetic:menu
          operation: view
          id: legendary
        states:
        - visible:
            type: equals
            input: '{item.section}'
            output: legendary
          skin: selected
        - visible: true
          skin: button
    - id: category_navigation
      type: row
      height: 27
      gap: 9
      children:
      - id: category_previous
        type: button
        text: <
        height: 27
        width: 27
        actions:
        - type: fotiacosmetic:menu
          operation: categories-previous
        enabled:
          type: equals
          input: '{item.category-previous}'
          output: 'true'
        states:
        - visible:
            type: equals
            input: '{item.category-previous-visible}'
            output: 'false'
          type: spacer
          text: ''
          actions: []
        - visible: true
      - id: categories
        type: list
        source: fotiacosmetic:menu
        view: categories
        cache: false
        paginate: false
        layout:
          type: row
          gap: 0
        item:
          id: category
          type: button
          text: <!i>{item.name}
          height: 27
          actions:
          - type: fotiacosmetic:menu
            operation: category
            id: '{item.id}'
          states:
          - visible:
              type: equals
              input: '{item.selected}'
              output: 'true'
            skin: selected
          - visible: true
            skin: button
          width: 90
        width: 180
      - id: category_next
        type: button
        text: '>'
        height: 27
        width: 27
        actions:
        - type: fotiacosmetic:menu
          operation: categories-next
        enabled:
          type: equals
          input: '{item.category-next}'
          output: 'true'
        states:
        - visible:
            type: equals
            input: '{item.category-next-visible}'
            output: 'false'
          type: spacer
          text: ''
          actions: []
        - visible: true
    - id: workspace
      type: row
      gap: 9
      children:
      - id: preview
        template: integrations/fotiacosmetic/preview_unified_compact
      - id: selection_panel
        type: column
        width: 162
        padding: 0
        gap: 0
        skin: panel
        children:
        - id: selection_items
          type: column
          gap: 0
          children:
          - id: entries
            type: list
            source: fotiacosmetic:menu
            view: entries
            cache: false
            paginate: false
            icon: diamond
            item:
              id: entry
              template: integrations/fotiacosmetic/entry_unified_compact
            layout:
              type: grid
              columns: 2
              gap: 9
            visible:
              type: equals
              input: '{item.empty}'
              output: 'false'
            states:
            - visible:
                type: all
                conditions:
                - type: equals
                  input: '{item.empty}'
                  output: 'false'
                - type: equals
                  input: '{item.weapon}'
                  output: 'true'
              icon: iron_sword
            - visible:
                type: equals
                input: '{item.empty}'
                output: 'false'
            thumbnail-yaw: -25
          - id: empty_box
            type: column
            height: 81
            gap: 0
            padding: 0
            skin: readout
            vertical-align: center
            visible:
              type: equals
              input: '{item.empty}'
              output: 'true'
            children:
            - id: empty_title
              type: text
              text: '@integrations.fotiacosmetic.empty-title'
              height: 27
            - id: empty_help
              type: text
              text: '@integrations.fotiacosmetic.empty-help'
              height: 45
          min-height: 81
        - id: paging
          type: row
          gap: 0
          children:
          - id: previous
            type: button
            text: <
            height: 27
            actions:
            - type: fotiacosmetic:menu
              operation: previous
            enabled:
              type: equals
              input: '{item.previous}'
              output: 'true'
            states:
            - visible:
                type: equals
                input: '{item.previous-visible}'
                output: 'false'
              type: spacer
              text: ''
              actions: []
            - visible: true
            width: 27
          - id: page_number
            type: text
            text: '@integrations.fotiacosmetic.compact-page'
            height: 27
            width: 108
            skin: readout
            text-align: center
            vertical-align: center
          - id: next
            type: button
            text: '>'
            height: 27
            actions:
            - type: fotiacosmetic:menu
              operation: next
            enabled:
              type: equals
              input: '{item.next}'
              output: 'true'
            states:
            - visible:
                type: equals
                input: '{item.next-visible}'
                output: 'false'
              type: spacer
              text: ''
              actions: []
            - visible: true
            width: 27
        - id: secondary_actions
          type: row
          gap: 0
          children:
          - id: layout_choice
            type: button
            text: '@integrations.fotiacosmetic.standard-layout'
            height: 27
            actions:
            - type: fotiacosmetic:menu
              operation: layout
              id: standard
          - id: back
            type: button
            text: '@integrations.fotiacosmetic-unified.back'
            height: 27
            actions:
            - type: fotiacosmetic:menu
              operation: back
